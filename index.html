<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>인디 아카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 상단 고정 내비 + 1120px 본문 · 폰에서는 하단 탭바 · 다크 우선 (기존 IA·온보딩 톤 계승) */
:root{
  --bg:#0f0e14; --surface:#18161f; --surface-2:#221f2c; --line:#2e2a3a;
  --fg:#ecebf3; --muted:#958fab; --accent:#8b7cf6; --accent-weak:#272143; --on-accent:#ffffff;
  --ok:#55c483; --ok-weak:#15301f; --warn:#e6ab43; --warn-weak:#33280f; --bad:#ef6f76; --bad-weak:#3a1b1e;
  --seat:#2b2738; --seat-taken:#3a3646;
  --font-display:'Black Han Sans','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:6px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f4f9; --surface:#ffffff; --surface-2:#eeecf5; --line:#dfdbea;
    --fg:#17151f; --muted:#666079; --accent:#5d4ddb; --accent-weak:#e8e4fc; --on-accent:#ffffff;
    --ok:#22804a; --ok-weak:#ddf2e5; --warn:#9a6409; --warn-weak:#f8ecd2; --bad:#c23842; --bad-weak:#fbe2e4;
    --seat:#e4e1ee; --seat-taken:#c9c5d6;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f5f4f9; --surface:#ffffff; --surface-2:#eeecf5; --line:#dfdbea;
  --fg:#17151f; --muted:#666079; --accent:#5d4ddb; --accent-weak:#e8e4fc; --on-accent:#ffffff;
  --ok:#22804a; --ok-weak:#ddf2e5; --warn:#9a6409; --warn-weak:#f8ecd2; --bad:#c23842; --bad-weak:#fbe2e4;
  --seat:#e4e1ee; --seat-taken:#c9c5d6;
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
p{margin:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono)}

/* ---------- 상단 · 하단 내비 ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding-inline:16px;height:58px;display:flex;align-items:center;gap:24px}
.logo{background:none;border:0;padding:0;font-family:var(--font-display);font-size:21px;letter-spacing:-.5px;color:var(--fg);white-space:nowrap}
.logo i{font-style:normal;color:var(--accent)}
.nav{display:flex;gap:2px;flex:1;min-width:0}
.nav button{background:none;border:0;padding:8px 12px;border-radius:var(--r);color:var(--muted);font-weight:500;position:relative;white-space:nowrap}
.nav button:hover{color:var(--fg)}
.nav button[aria-current="page"]{color:var(--fg);background:var(--surface-2)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;margin-left:4px;font-variant-numeric:tabular-nums}
.tools{display:flex;align-items:center;gap:12px;margin-left:auto}
.devtoggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;cursor:pointer}
.proto{font-family:var(--font-mono);font-size:11px;color:var(--muted);border:1px dashed var(--line);padding:3px 8px;border-radius:4px;white-space:nowrap}
.tabbar{display:none}
body.bare .nav,body.bare .tabbar{display:none!important}

/* ---------- 본문 ---------- */
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:32px 96px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:600}
.display{font-family:var(--font-display);font-weight:400;font-size:clamp(34px,5vw,52px);line-height:1.15;letter-spacing:-.5px}
.display-s{font-family:var(--font-display);font-weight:400;font-size:clamp(26px,3.6vw,34px);line-height:1.2}
.lead{color:var(--muted);font-size:16px;max-width:60ch}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:24px}
.page-head h1{font-size:26px;font-weight:700}
.sec{display:grid;gap:14px}
.sec + .sec{margin-top:40px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-head h2{font-size:17px;font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
.split > *{min-width:0}

/* ---------- 버튼 · 칩 · 상태 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--r);padding:10px 18px;font-weight:600;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{filter:brightness(1.08);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn-s{padding:6px 12px;font-size:13px}
.btn.on{background:var(--accent-weak);border-color:var(--accent);color:var(--accent)}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--fg)}
.chip:hover{border-color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chips.big .chip{padding:12px 20px;font-size:16px}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-weak);color:var(--ok)}
.pill.warn{background:var(--warn-weak);color:var(--warn)}
.pill.bad{background:var(--bad-weak);color:var(--bad)}
.pill.ac{background:var(--accent-weak);color:var(--accent)}
.tag{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--muted);font-weight:600;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:28px 20px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}

/* 개발 노트: API·이벤트 표시 (토글) */
.dev{display:none;font-family:var(--font-mono);font-size:11.5px;line-height:1.5;color:var(--warn);background:var(--warn-weak);padding:3px 8px;border-radius:4px;width:fit-content;max-width:100%;overflow-wrap:anywhere}
body.devmode .dev{display:inline-block}

/* ---------- 아바타 · 커버 ---------- */
.avatar{--s:44px;width:var(--s);height:var(--s);flex:none;border-radius:50%;display:inline-grid;place-items:center;background:linear-gradient(140deg,var(--c1),var(--c2));color:#fff;font-weight:700;font-size:calc(var(--s) * .4);text-shadow:0 1px 2px rgba(0,0,0,.35)}
.cover{position:relative;aspect-ratio:1;max-width:100%;border-radius:4px;overflow:hidden;background:linear-gradient(135deg,var(--c1),var(--c2));display:flex;align-items:flex-end;padding:10px;color:#fff;font-weight:700;font-size:13px;line-height:1.25}
.cover.v1::before{content:"";position:absolute;top:14%;right:14%;width:48%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.2)}
.cover.v2{background:repeating-linear-gradient(100deg,var(--c1) 0 14px,var(--c2) 14px 28px)}
.cover.v3{background:radial-gradient(circle at 28% 30%,var(--c2),var(--c1) 72%)}
.cover.v4::before{content:"";position:absolute;inset:auto -10% 30% -10%;height:22%;background:rgba(255,255,255,.16);transform:rotate(-8deg)}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),transparent 60%)}
.cover span{position:relative;z-index:1;text-shadow:0 1px 3px rgba(0,0,0,.4)}

/* ---------- 카드 그리드 ---------- */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.grid.albums{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.acard{display:grid;gap:12px;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;text-align:left;min-width:0}
.acard:hover{border-color:var(--muted)}
.acard .row{display:flex;align-items:center;gap:12px;min-width:0}
.acard .name{font-weight:700;font-size:16px;line-height:1.3}
.acard .sub{font-size:13px;color:var(--muted)}
.acard .why{font-size:13px;color:var(--fg);background:var(--surface-2);border-radius:var(--r);padding:8px 10px}
.acard .foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.alcard{display:grid;gap:8px;background:none;border:0;padding:0;text-align:left;min-width:0}
.alcard .t{font-weight:600;font-size:14px;line-height:1.35}
.alcard .s{font-size:12.5px;color:var(--muted)}
.match{font-family:var(--font-mono);font-size:12px;color:var(--accent);font-weight:500}

/* ---------- 리스트 ---------- */
.list{display:grid;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left;background:none;border:0;border-top:1px solid var(--line);width:100%;min-width:0}
.li:first-child{border-top:0}
button.li:hover{background:var(--surface-2)}
.li .main{flex:1;min-width:0;display:grid;gap:2px}
.li .main b{font-weight:600;overflow-wrap:anywhere}
.li .main small{color:var(--muted);font-size:13px}
.date{flex:none;width:52px;text-align:center;display:grid;line-height:1.15}
.date b{font-size:20px;font-variant-numeric:tabular-nums}
.date small{font-size:11.5px;color:var(--muted)}
.li .new{width:7px;height:7px;border-radius:50%;background:var(--bad);flex:none}

/* ---------- 폼 ---------- */
.form{display:grid;gap:8px}
.form h2{font-size:20px;margin-bottom:8px}
.form label{font-size:13px;color:var(--muted);font-weight:500;margin-top:6px}
.form input[type=text],.form input[type=email],.form input[type=password],.search{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px}
.form .btn{margin-top:14px}
.search{max-width:420px}
.check{display:flex;align-items:center;gap:8px;font-size:14px}

/* ---------- 가입 · 온보딩 ---------- */
.signup{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:56px;align-items:center;padding-block:24px}
.signup-copy{display:grid;gap:22px}
.points{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.points li{display:flex;gap:12px;align-items:baseline;color:var(--muted)}
.points b{color:var(--fg);font-family:var(--font-mono);font-size:12px;font-weight:500;width:34px;flex:none}
.onb{max-width:820px;margin:0 auto;display:grid;gap:22px}
.steps{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.steps span{height:4px;width:44px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--accent)}
.onb-foot{position:sticky;bottom:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;padding-inline:16px;margin-inline:-16px;background:color-mix(in srgb,var(--bg) 92%,transparent);border-top:1px solid var(--line)}
.pick{position:relative;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;min-width:0}
.pick.on{border-color:var(--accent);background:var(--accent-weak)}
.pick .ck{margin-left:auto;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--on-accent);flex:none}
.pick.on .ck{background:var(--accent);border-color:var(--accent)}
.saved{display:grid;gap:6px;font-size:13px;color:var(--muted)}

/* ---------- 첫 진입 (비로그인): 좌측 후킹 문구 · 우측 오늘 공연 ---------- */
.display.xl{font-size:clamp(40px,6.4vw,72px);line-height:1.08}
.tm{flex:none;width:52px;font-family:var(--font-mono);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--accent)}

/* ---------- 아티스트 상세 ---------- */
.hero-a{display:flex;flex-wrap:wrap;align-items:center;gap:20px 24px;padding-bottom:28px;border-bottom:1px solid var(--line);margin-bottom:28px}
.hero-a .meta{flex:1;min-width:220px;display:grid;gap:6px}
.hero-a h1{font-family:var(--font-display);font-weight:400;font-size:clamp(30px,4.4vw,42px)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{text-align:left;padding:10px 12px;border-top:1px solid var(--line)}
.table th{font-weight:500;color:var(--muted);font-size:12.5px;border-top:0}
.table td.r,.table th.r{text-align:right}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}

/* ---------- 공연 ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.cal .wd{padding:8px;font-size:12px;color:var(--muted);text-align:center;border-bottom:1px solid var(--line)}
.cal .d{min-height:92px;padding:6px;border-top:1px solid var(--line);border-left:1px solid var(--line);display:grid;align-content:start;gap:4px;min-width:0}
.cal .d:nth-child(7n+1){border-left:0}
.cal .d.out{background:var(--bg)}
.cal .d .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cal .d.today .n{color:var(--accent);font-weight:700}
.cal .ev{display:block;width:100%;text-align:left;font-size:11.5px;line-height:1.3;padding:3px 5px;border-radius:4px;border:0;background:var(--accent-weak);color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev.fest{background:var(--warn-weak);color:var(--warn)}
.poster{border-radius:10px;padding:28px;min-height:220px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;background:linear-gradient(150deg,var(--c1),var(--c2));color:#fff;position:relative;overflow:hidden}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6),transparent 70%)}
.poster > *{position:relative;z-index:1}
.poster h1{font-family:var(--font-display);font-weight:400;font-size:clamp(26px,4vw,38px);line-height:1.15}
.poster .tag{color:rgba(255,255,255,.85)}

/* 대기열 · 좌석 · 결제 */
.queue{max-width:520px;margin:24px auto;text-align:center;display:grid;gap:18px;justify-items:center}
.queue .big{font-family:var(--font-mono);font-size:64px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.bar{width:100%;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .35s}
.timer{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:13px;padding:4px 10px;border-radius:4px;background:var(--accent-weak);color:var(--accent);white-space:nowrap}
.timer.warn{background:var(--warn-weak);color:var(--warn)}
.stage{text-align:center;font-size:12px;letter-spacing:.3em;color:var(--muted);border:1px solid var(--line);border-radius:4px 4px 40px 40px;padding:8px;margin-bottom:18px}
.seatmap-wrap{overflow-x:auto;padding-bottom:6px}
.seatmap{display:grid;gap:6px;width:max-content;margin:0 auto}
.srow{display:flex;gap:6px;align-items:center}
.srow .rl{width:18px;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.srow .gap{width:14px}
.seat{width:28px;height:26px;border-radius:5px 5px 3px 3px;border:0;background:var(--seat);font-size:10px;color:var(--muted);font-family:var(--font-mono)}
.seat:hover{outline:1.5px solid var(--accent)}
.seat.sel{background:var(--accent);color:var(--on-accent)}
.seat.paid{background:var(--seat-taken);color:transparent;cursor:not-allowed}
.seat.held{background:repeating-linear-gradient(45deg,var(--warn-weak) 0 4px,var(--seat) 4px 8px);color:transparent}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.sumbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}

/* ---------- AI 챗봇: 모든 화면 우측 하단 버튼 → 채팅 창 ---------- */
.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.fab:hover{filter:brightness(1.08)}
.fab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cpanel{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:30;width:min(400px,calc(100vw - 32px));height:min(600px,calc(100vh - 120px));display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 48px rgba(0,0,0,.35);overflow:hidden}
.cpanel-head{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.cpanel-head .t{flex:1;min-width:0;display:grid;line-height:1.35}
.cpanel-head small{color:var(--muted);font-size:12px}
.chat{flex:1;overflow-y:auto;padding:14px;display:grid;align-content:start;gap:14px}
.chat .grid{gap:10px}
.chat .grid.albums{grid-template-columns:repeat(3,minmax(0,1fr))}
.msg{display:grid;gap:12px;max-width:100%}
.msg.me{justify-self:end;background:var(--accent);color:var(--on-accent);padding:10px 16px;border-radius:14px 14px 4px 14px;max-width:80%}
.msg.bot{background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:14px}
.ctx{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);padding-top:10px;border-top:1px solid var(--line)}
.ask{display:flex;gap:8px;padding:10px;background:var(--surface);border-top:1px solid var(--line)}
.ask input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px}
.typing{color:var(--muted);font-size:14px}
.ask-tools{display:flex;justify-content:flex-end;padding:8px 10px 0;background:var(--surface);border-top:1px solid var(--line)}
.ask-tools + .ask{border-top:0}
.ask-tools svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.eq{display:inline-flex;align-items:flex-end;gap:3px;height:14px;margin-right:8px;vertical-align:-1px}
.eq i{width:3px;height:100%;border-radius:2px;background:currentColor;transform-origin:bottom;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.2s}.eq i:nth-child(3){animation-delay:-.4s}.eq i:nth-child(4){animation-delay:-.6s}.eq i:nth-child(5){animation-delay:-.8s}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.btn-danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn-danger:hover{filter:brightness(1.08);border-color:var(--bad)}

/* ---------- 관리자 · 무대 편집 (꼭짓점 좌표만 저장 · 좌석은 네모 격자 유지) ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar label{cursor:pointer}
.canvas{display:block;width:100%;aspect-ratio:4/3;background:var(--bg);border:1px dashed var(--line);border-radius:8px;cursor:crosshair;touch-action:manipulation}
.canvas .hint{fill:var(--muted);font-size:13px;font-family:var(--font-body)}
.canvas polyline{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4}
.canvas circle{fill:var(--accent);stroke:var(--bg);stroke-width:2}
.stage-shape{fill:color-mix(in srgb,var(--accent) 22%,transparent);stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke}
.stage-drawn{position:relative;margin-bottom:18px}
.stage-drawn svg{display:block;width:100%;height:auto;max-height:140px}
.stage-drawn span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;letter-spacing:.3em;color:var(--muted);pointer-events:none}
.mini-seats{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px}
.mini-seats i{aspect-ratio:1;border-radius:2px;background:var(--seat)}

/* ---------- 보조 ---------- */
.acard button.row{background:none;border:0;padding:0;text-align:left;color:inherit}
.nm{min-width:0;overflow-wrap:anywhere}
.mini-cover{width:52px;flex:none}
.mini-cover .cover{padding:0}
.mini-cover .cover span{display:none}
.li .end{display:grid;gap:4px;justify-items:end;flex:none}
.album-head{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:24px;align-items:end;margin-bottom:32px}
.big-cover .cover{font-size:18px;padding:16px}
.tracks{margin:0;padding:0 0 0 1.6em;display:grid;gap:0;counter-reset:none}
.tracks li{padding:10px 4px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.tracks li::marker{color:var(--muted);font-family:var(--font-mono);font-size:12px}
.form .check{color:var(--fg);font-size:14px;font-weight:400}
.form .check.fail{margin-top:14px;color:var(--muted)}
@media (max-width:560px){.album-head{grid-template-columns:minmax(0,1fr)}.big-cover{max-width:240px}}

/* 소셜 로그인 버튼: 각 브랜드 가이드 색상을 테마와 무관하게 고정 */
.form .sso{width:100%;margin-top:6px;padding:12px 18px;gap:10px}
.sso svg{width:18px;height:18px;flex:none}
.sso.kakao{background:#FEE500;border-color:#FEE500;color:rgba(0,0,0,.85)}
.sso.google{background:#ffffff;border-color:#747775;color:#1f1f1f}
.sso.kakao:hover,.sso.google:hover{filter:brightness(.96)}

/* ---------- 토스트 ---------- */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:8px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}

/* ---------- 반응형 ---------- */
@media (max-width:960px){
  .split{grid-template-columns:minmax(0,1fr)}
  .signup{grid-template-columns:minmax(0,1fr);gap:32px}
}
@media (max-width:760px){

  .tabbar button{background:none;border:0;padding:10px 2px;font-size:11.5px;color:var(--muted);font-weight:500}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  .tabbar .badge{min-width:16px;height:16px;font-size:10px;padding:0 4px}
  .cal .d{min-height:54px}
  .cal .ev{font-size:0;height:6px;padding:0}
  .wrap{padding-block:20px 140px}
  .onb-foot{bottom:0}
  .fab{bottom:calc(68px + env(safe-area-inset-bottom,0px))}
  .cpanel{inset:0;width:auto;height:auto;border:0;border-radius:0;z-index:40}
  .cpanel-head{padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .ask{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
/* ===== 상태 ===== */
const S = {
  route:'landing', p:{},
  user:{nick:'새벽청취자', email:'', provider:null, genres:[], follows:{}, onboarded:false},
  draft:{tops:[], genres:[], artists:[], revealed:[]},
  wish:new Set(), owned:new Set(['al8']), interest:new Set(),
  bookings:[], activity:[], lastSeen:0, feedFilter:'전체', simStep:0,
  q:'', gfilter:'전체', cview:'캘린더', month:9, region:'전체', ctype:'전체',
  atab:'신보', mtab:'관심 아티스트', seats:{}, flow:null, chat:[], chatOpen:false,
  stages:{}, admin:{venue:CONCERTS[0].venue, img:null, pts:[]}
};
let timers = [];

/* ===== 도우미 ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => n.toLocaleString('ko-KR') + '원';
const A = id => ARTISTS.find(x => x.id === id);
const AL = id => ALBUMS.find(x => x.id === id);
const CO = id => CONCERTS.find(x => x.id === id);
const WD = ['일','월','화','수','목','금','토'];
const day = s => new Date(s + 'T00:00:00');
const MIDNIGHT = day('2026-10-08');
const isPast = s => day(s) < MIDNIGHT;
const isUpcoming = s => day(s) > MIDNIGHT;
const md = s => { const d = day(s); return `${d.getMonth()+1}.${d.getDate()} (${WD[d.getDay()]})`; };
const byDate = (x, y) => x.date.localeCompare(y.date);
const dev = t => `<code class="dev">${esc(t)}</code>`;
const following = id => !!S.user.follows[id];
const followedIds = () => Object.keys(S.user.follows);
const hasB = w => { const c = w.charCodeAt(w.length - 1); return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0; };
const wa = w => w + (hasB(w) ? '과' : '와');
const avatar = (a, s = 44) => `<span class="avatar" style="--c1:${a.colors[0]};--c2:${a.colors[1]};--s:${s}px" aria-hidden="true">${esc(a.name[0])}</span>`;
const cover = al => { const a = A(al.artist); return `<div class="cover v${al.v}" style="--c1:${a.colors[0]};--c2:${a.colors[1]}"><span>${esc(al.title)}</span></div>`; };
const names = ids => ids.map(i => A(i).name).join(' · ');
function stockState(al) {
  if (!al.lp) return null;
  if (!al.stock.length) return ['발매 전', 'ac'];
  return al.stock.some(x => x[2] > 0) ? ['재고 있음', 'ok'] : ['품절', 'bad'];
}
function toast(t) {
  const el = $('#toast'); el.textContent = t; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 3000);
}

/* ===== 취향 점수 (개인 RAG 흉내) ===== */
function tasteScore(a) {
  const fg = followedIds().flatMap(id => A(id).genres);
  return a.genres.reduce((s, g) => s + (S.user.genres.includes(g) ? 2 : 0) + (fg.includes(g) ? 1 : 0), 0);
}
function why(a) {
  const g = a.genres.find(x => S.user.genres.includes(x));
  const f = followedIds().map(A).find(b => b.id !== a.id && b.genres.some(x => a.genres.includes(x)));
  if (g && f) return `고른 장르 ${g} · 팔로우한 ${wa(f.name)} 비슷해요`;
  if (g) return `고른 장르 ${wa(g)} 맞아요`;
  if (f) return `팔로우한 ${wa(f.name)} 장르가 겹쳐요`;
  return '요즘 팔로우가 많이 늘고 있어요';
}
const hasTaste = () => S.user.genres.length > 0 || followedIds().length > 0;
function recommend(n = 3, pool = ARTISTS) {
  const list = pool.filter(a => !following(a.id));
  if (!hasTaste()) return list.slice().sort((x, y) => y.followers - x.followers).slice(0, n).map(a => ({ a, pct: null }));
  return list.map(a => ({ a, s: tasteScore(a) }))
    .sort((x, y) => y.s - x.s || y.a.followers - x.a.followers).slice(0, n)
    .map(({ a, s }) => ({ a, pct: Math.min(97, 52 + s * 10 + (a.followers % 7)) }));
}

/* ===== 공용 조각 ===== */
const followBtn = id => `<button class="btn btn-s ${following(id) ? 'on' : ''}" data-act="follow" data-id="${id}" aria-pressed="${following(id)}">${following(id) ? '팔로잉' : '팔로우'}</button>`;
function acard(a, o = {}) {
  return `<article class="acard">
    <button class="row" data-go="artist" data-id="${a.id}">${avatar(a)}<span class="nm"><span class="name">${esc(a.name)}</span><br><span class="sub">${esc(a.genres.join(' · '))} · ${esc(a.city)}</span></span></button>
    ${o.reason ? `<p class="why">${esc(o.reason)}</p>` : ''}
    <div class="foot">${o.pct ? `<span class="match">취향 일치 ${o.pct}%</span>` : `<span class="tag num">팔로워 ${a.followers.toLocaleString()}</span>`}${followBtn(a.id)}</div>
  </article>`;
}
const concertLi = c => { const d = day(c.date); return `<button class="li" data-go="concert" data-id="${c.id}">
  <span class="date"><b>${d.getDate()}</b><small>${d.getMonth()+1}월 ${WD[d.getDay()]}</small></span>
  <span class="main"><b>${esc(c.title)}</b><small>${esc(c.venue)} · ${c.region} · ${c.time}</small></span>
  <span class="pill ${c.type === '페스티벌' ? 'warn' : 'ac'}">${c.type}</span></button>`; };
const alCard = al => { const st = stockState(al); return `<button class="alcard" data-go="album" data-id="${al.id}">${cover(al)}
  <span class="t">${esc(al.title)}</span><span class="s">${esc(A(al.artist).name)} · ${al.type} · ${al.date.replaceAll('-', '.')}</span>
  ${isUpcoming(al.date) ? '<span class="pill ac">발매 예정</span>' : st ? `<span class="pill ${st[1]}">LP ${st[0]}</span>` : ''}</button>`; };
const stockTable = al => `<div class="tbl-wrap"><table class="table"><thead><tr><th>판매처</th><th class="r">가격</th><th class="r">재고</th></tr></thead><tbody>
  ${al.stock.map(([s, p, q]) => `<tr><td>${esc(s)}</td><td class="r num">${won(p)}</td><td class="r">${q > 0 ? `<span class="pill ok num">${q}장</span>` : '<span class="pill bad">품절</span>'}</td></tr>`).join('')}
  </tbody></table></div>`;
const steps = n => `<div class="steps"><span class="on"></span><span class="${n >= 2 ? 'on' : ''}"></span><small>취향 고르기 ${n}/2</small></div>`;

/* ===== 화면 ===== */
const V = {}, AFTER = {};

V.landing = () => {
  const today = CONCERTS.filter(c => c.date === '2026-10-08').sort((x, y) => x.time.localeCompare(y.time));
  return `
<section class="signup">
  <div class="signup-copy">
    <p class="eyebrow">한국 인디 공연 · 신보 · LP</p>
    <h1 class="display xl">오늘 밤,<br>어떤 밴드가<br>무대에 오를까요?</h1>
    <p class="lead">공연 일정부터 대기열·좌석 예매, 신보와 LP 재고까지. 좋아하는 밴드를 기준으로 한 곳에 모아 드려요.</p>
  </div>
  <div class="panel sec">
    <div class="sec-head"><h2>오늘의 인디 공연</h2><span class="tag">${md('2026-10-08')} · ${today.length}건</span></div>
    ${today.length ? `<div class="list">${today.map(c => `<div class="li"><span class="tm">${c.time}</span>
      <span class="main"><b>${esc(c.title)}</b><small>${esc(names(c.artists))} · ${esc(c.venue)}</small></span><span class="tag num">${won(c.price)}</span></div>`).join('')}</div>`
    : '<div class="empty">오늘은 예정된 공연이 없어요.</div>'}
    <p class="tag">로그인하면 바로 예매하고, 좋아하는 밴드의 다음 공연 소식도 받아볼 수 있어요.</p>
    ${dev('GET /api/concerts?from=2026-10-08&to=2026-10-08 → concert:cache:* (비로그인 공개)')}
  </div>
</section>`;
};

V.signup = () => `
<section class="signup">
  <div class="signup-copy">
    <p class="eyebrow">한국 인디 공연 · 신보 · LP</p>
    <h1 class="display">좋아하는 밴드의 소식을<br>한 곳에서</h1>
    <p class="lead">공연 일정, 신보, LP 재고를 아티스트 기준으로 모아 보여드려요. 가입할 때 고른 취향은 AI 추천에 바로 쓰여요.</p>
    <ul class="points">
      <li><b>공연</b><span>대기열부터 좌석 예매까지 여기서 끝내요</span></li>
      <li><b>LP</b><span>판매처별 재고를 비교하고 재입고 알림을 받아요</span></li>
      <li><b>AI</b><span>취향과 앞선 대화를 기억하는 챗봇에게 물어봐요</span></li>
    </ul>
  </div>
  <div style="display:grid;gap:14px">
  <div class="panel form">
    <h2>시작하기</h2>
    <p class="tag">처음이면 바로 가입되고, 이미 가입했다면 로그인돼요.</p>
    <button class="btn sso kakao" data-act="sso" data-v="kakao">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#000" d="M12 3C6.48 3 2 6.58 2 11c0 2.85 1.86 5.35 4.66 6.77l-.95 3.48c-.08.3.26.54.52.37l4.15-2.75c.53.07 1.07.11 1.62.11 5.52 0 10-3.58 10-8S17.52 3 12 3z"/></svg>
      카카오로 시작하기</button>
    <button class="btn sso google" data-act="sso" data-v="google">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Google로 시작하기</button>
    ${dev('GET /oauth2/authorization/{kakao|google} → 콜백 → Member: provider + provider_id 로 users 조회·생성 → JWT 발급')}
    <p class="tag" style="text-align:center;margin-top:6px">프로토타입이라 실제 로그인은 일어나지 않아요. 누르면 가입된 것처럼 넘어가요.</p>
  </div>
  <p class="tag" style="text-align:center">공연장 관리자라면 <button class="link" data-go="admin">관리자로 들어가기</button></p>
  </div>
</section>`;

// 1단계: 큰 장르만 고르고 세부 장르를 안 고르면 그 아래 세부 장르 전체로 봄
const pickedGenres = () => GENRE_TREE.filter(t => S.draft.tops.includes(t.name))
  .flatMap(t => { const s = t.subs.filter(g => S.draft.genres.includes(g)); return s.length ? s : t.subs; });
// 2단계 비슷한 밴드: 운영은 artist 임베딩 유사도(pgvector) · 데모는 장르 겹침 + 같은 레이블로 흉내
function similar(a, skip) {
  return ARTISTS.filter(b => b.id !== a.id && !skip.has(b.id))
    .map(b => ({ b, s: b.genres.filter(x => a.genres.includes(x)).length * 2 + (a.label !== '독립' && b.label === a.label ? 1 : 0) }))
    .filter(x => x.s > 0).sort((x, y) => y.s - x.s || y.b.followers - x.b.followers).slice(0, 3).map(x => x.b);
}
const gchip = (act, v, on) => `<button class="chip ${on ? 'on' : ''}" data-act="${act}" data-v="${v}" aria-pressed="${on}">${v}</button>`;

V.genre = () => { const d = S.draft; return `
<section class="onb">
  ${steps(1)}
  <h1 class="display-s">어떤 음악을 즐겨 들으세요?</h1>
  <p class="lead">하나 이상 골라 주세요. 고르면 아래에 세부 장르가 열려요.</p>
  <div class="chips big">${GENRE_TREE.map(t => gchip('pickTop', t.name, d.tops.includes(t.name))).join('')}</div>
  ${GENRE_TREE.filter(t => d.tops.includes(t.name)).map(t => `<div class="sec"><div class="sec-head"><h2>${t.name}에서 더 고르기</h2><span class="tag">안 고르면 ${t.name} 전체로 볼게요</span></div>
    <div class="chips">${t.subs.map(g => gchip('pickGenre', g, d.genres.includes(g))).join('')}</div></div>`).join('')}
  <div class="onb-foot">
    <span class="muted">${d.tops.length ? esc(pickedGenres().join(' · ')) : '아직 고른 장르가 없어요'}</span>
    <button class="btn btn-primary" data-act="toArtists" ${d.tops.length ? '' : 'disabled'}>다음</button>
  </div>
</section>`; };

V.pickArtists = () => {
  const g = pickedGenres(), n = S.draft.artists.length;
  const base = ARTISTS.filter(a => a.genres.some(x => g.includes(x)));
  // 고른 밴드마다 비슷한 밴드 섹션을 아래에 추가. 이미 화면에 있는 밴드는 다시 넣지 않음
  const shown = new Set(base.map(a => a.id));
  const more = S.draft.revealed.map(id => { const list = similar(A(id), shown); list.forEach(b => shown.add(b.id)); return { a: A(id), list }; }).filter(m => m.list.length);
  const pick = a => { const on = S.draft.artists.includes(a.id); return `<button class="pick ${on ? 'on' : ''}" data-act="pickArtist" data-id="${a.id}" aria-pressed="${on}">
    ${avatar(a, 40)}<span class="nm"><b>${esc(a.name)}</b><br><small class="muted">${esc(a.genres.join(' · '))}</small></span><span class="ck">${on ? '✓' : ''}</span></button>`; };
  return `
<section class="onb">
  ${steps(2)}
  <h1 class="display-s">좋아하는 밴드를 골라 주세요</h1>
  <p class="lead">고른 밴드는 바로 팔로우돼요. 하나를 고르면 비슷한 밴드가 아래에 더 열려요.</p>
  <div class="sec"><div class="sec-head"><h2>고른 장르의 밴드</h2><span class="tag">${base.length}팀</span></div><div class="grid">${base.map(pick).join('')}</div></div>
  ${more.map(m => `<div class="sec"><div class="sec-head"><h2>${esc(wa(m.a.name))} 비슷한 밴드</h2><span class="tag">${m.list.length}팀</span></div><div class="grid">${m.list.map(pick).join('')}</div></div>`).join('')}
  ${dev('밴드를 고를 때마다 GET /api/artists/{id}/similar → AI 내부 벡터 검색 (artist 임베딩 top-3)')}
  <div class="onb-foot">
    <div class="saved"><span><b class="num">${n}</b>팀 · 장르 ${g.length}개를 AI 추천에 써요</span>
      ${dev('POST /api/members/me/onboarding → user_genre · follow 저장 + outbox → member.preference.updated → ai_db.user_taste')}</div>
    <div style="display:flex;gap:8px"><button class="btn" data-act="skipOnb">건너뛰기</button>
      <button class="btn btn-primary" data-act="finishOnb" ${n ? '' : 'disabled'}>완료하고 시작하기</button></div>
  </div>
</section>`;
};

V.home = () => {
  const fol = followedIds(), seen = S.lastSeen;
  const recs = recommend(3);
  const feed = S.activity.filter(x => S.feedFilter === '전체' || x.kind === S.feedFilter).sort((x, y) => y.at - x.at);
  const upcoming = CONCERTS.filter(c => !isPast(c.date) && (!fol.length || c.artists.some(following))).sort(byDate).slice(0, 4);
  const fresh = ALBUMS.slice().sort((x, y) => y.date.localeCompare(x.date)).slice(0, 4);
  return `
<div class="page-head">
  <div><p class="eyebrow">${md('2026-10-08')} 오늘</p><h1>${esc(S.user.nick)}님을 위한 인디 소식</h1></div>
  ${fol.length ? `<span class="muted">팔로우 <b class="num">${fol.length}</b>팀 · 고른 장르 ${S.user.genres.length}개</span>` : ''}
</div>
<div class="split">
  <div>
    <section class="sec">
      <div class="sec-head"><h2>취향 기반 추천</h2><button class="link" data-act="openChat">AI에게 더 물어보기</button></div>
      ${hasTaste() ? '' : '<p class="muted">아직 고른 취향이 없어서 요즘 많이 팔로우하는 밴드를 보여드려요. <button class="link" data-act="openTaste">취향 고르기</button></p>'}
      ${dev('GET /api/ai/recommendations → ai_db.user_taste 벡터 · pgvector HNSW')}
      <div class="grid">${recs.map(r => acard(r.a, { pct: r.pct, reason: hasTaste() ? why(r.a) : null })).join('')}</div>

<script>
/* ===== 공연 · 예매 ===== */
const mmss = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const chip = (act, v, cur, label = v) => `<button class="chip ${cur === v ? 'on' : ''}" data-act="${act}" data-v="${v}">${label}</button>`;

function calendar(y, m, list) {
  const start = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate(), cells = [];
  for (let i = 0; i < start; i++) cells.push('<div class="d out"></div>');
  for (let d = 1; d <= days; d++) {
    const ds = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const evs = list.filter(c => c.date === ds);
    cells.push(`<div class="d ${ds === '2026-10-08' ? 'today' : ''}"><span class="n">${d}</span>${evs.map(c => `<button class="ev ${c.type === '페스티벌' ? 'fest' : ''}" data-go="concert" data-id="${c.id}" title="${esc(c.title)}">${esc(names(c.artists))}</button>`).join('')}</div>`);
  }
  while (cells.length % 7) cells.push('<div class="d out"></div>');
  return `<div class="sec-head"><button class="btn btn-s" data-act="month" data-v="-1" ${m <= 9 ? 'disabled' : ''} aria-label="이전 달">‹</button>
    <h2 class="num">${y}년 ${m + 1}월</h2><button class="btn btn-s" data-act="month" data-v="1" ${m >= 11 ? 'disabled' : ''} aria-label="다음 달">›</button></div>
    <div class="cal">${WD.map(w => `<div class="wd">${w}</div>`).join('')}${cells.join('')}</div>`;
}

V.concerts = () => {
  const list = CONCERTS.filter(c => (S.region === '전체' || c.region === S.region) && (S.ctype === '전체' || c.type === S.ctype)).sort(byDate);
  const inMonth = list.filter(c => day(c.date).getMonth() === S.month);
  const shown = S.cview === '캘린더' ? inMonth : list;
  return `
<div class="page-head"><h1>공연</h1><div class="chips">${['캘린더', '목록'].map(v => chip('cview', v, S.cview)).join('')}</div></div>
<div class="sec">
  <div class="chips">${['전체', '서울', '부산', '대구', '인천'].map(r => chip('region', r, S.region, r === '전체' ? '모든 지역' : r)).join('')}</div>
  <div class="chips">${['전체', '단독', '페스티벌'].map(t => chip('ctype', t, S.ctype, t === '전체' ? '모든 유형' : t)).join('')}</div>
  ${dev('GET /api/concerts?region=&type=&from=&to= → concert:cache:*')}
  ${S.cview === '캘린더' ? calendar(2026, S.month, list) : ''}
  ${shown.length ? `<div class="list">${shown.map(concertLi).join('')}</div>` : '<div class="empty">조건에 맞는 공연이 없어요. 지역이나 유형을 바꿔 보세요.</div>'}
</div>`;
};

V.concert = ({ id }) => {
  const c = CO(id), a = A(c.artists[0]), it = S.interest.has(id);
  return `
<button class="link" data-go="concerts">← 공연 목록</button>
<div class="split" style="margin-top:16px">
  <div>
    <section class="sec"><div class="poster" style="--c1:${a.colors[0]};--c2:${a.colors[1]}">
      <span class="tag">${c.type} · ${c.region}</span><h1>${esc(c.title)}</h1><span class="tag">${esc(names(c.artists))}</span></div></section>
    <section class="sec"><div class="sec-head"><h2>출연</h2></div><div class="grid">${c.artists.map(x => acard(A(x))).join('')}</div></section>
  </div>
  <aside class="panel sec">
    <dl class="kv"><dt>일시</dt><dd>${md(c.date)} ${c.time}</dd><dt>장소</dt><dd>${esc(c.venue)}</dd><dt>주소</dt><dd>${esc(c.addr)}</dd>
      <dt>유형</dt><dd>${c.type}</dd><dt>가격</dt><dd class="num">${won(c.price)}</dd></dl>
    <button class="btn btn-primary" data-act="book" data-id="${id}">예매하기</button>
    <button class="btn ${it ? 'on' : ''}" data-act="interest" data-id="${id}" aria-pressed="${it}">${it ? '관심 공연에 담았어요' : '관심 공연 담기'}</button>
    <p class="tag">예매하기를 누르면 대기열에 들어가요. 순서가 되면 10분 동안 좌석을 고를 수 있어요.</p>
    ${dev(`POST /api/concerts/${id}/queue → ZADD queue:concert:${id}`)}
  </aside>
</div>`;
};

V.queue = ({ id }) => {
  const c = CO(id);
  return `
<div class="queue">
  <p class="eyebrow">${esc(c.title)}</p>
  <h1 class="display-s" id="qTitle">예매 대기 중이에요</h1>
  <div><div class="big" id="qPos">${c.queue.toLocaleString()}</div><p class="muted" id="qSub">내 앞에 기다리는 사람</p></div>
  <div class="bar"><i id="qBar" style="width:0%"></i></div>
  <p class="muted">순서가 되면 좌석 선택 화면으로 자동으로 넘어가요. 이 화면을 떠나면 순서가 사라져요.</p>
  ${dev(`ZADD queue:concert:${id} → ZRANK 폴링`)}<code class="dev" id="qDev">대기 중</code>
  <button class="btn" data-go="concert" data-id="${id}">대기 취소</button>
</div>`;
};
AFTER.queue = () => {
  const c = CO(S.p.id), total = c.queue; let pos = total;
  const t = setInterval(() => {
    pos = Math.max(0, pos - Math.ceil(total * (0.08 + Math.random() * 0.1)));
    $('#qPos').textContent = pos.toLocaleString();
    $('#qBar').style.width = (100 - pos / total * 100) + '%';
    if (pos > 0) return;
    clearInterval(t);
    $('#qTitle').textContent = '내 차례예요';
    $('#qSub').textContent = '입장 토큰을 받았어요. 10분 안에 좌석을 골라 주세요';
    $('#qDev').textContent = `ZPOPMIN → SET entry:${c.id}:{uid} EX 600`;
    S.flow = { cid: c.id, entryUntil: Date.now() + 600000, sel: [], holdUntil: 0 };
    timers.push(setTimeout(() => go('seats', { id: c.id }), 1100));
  }, 450);
  timers.push(t);
};

const SEAT_LABEL = { free: '선택 가능', sel: '내 선택', mine: '내 선택', held: '다른 사람이 결제 중', paid: '예매 완료' };
function seatMap(cid) {
  if (S.seats[cid]) return S.seats[cid];
  let seed = cid.charCodeAt(1) * 9973 + 7;
  const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  const map = {};
  'ABCDEFG'.split('').forEach(r => { for (let n = 1; n <= 12; n++) { const x = rnd(); map[`${r}-${n}`] = x < 0.34 ? 'paid' : x < 0.40 ? 'held' : 'free'; } });
  return (S.seats[cid] = map);
}
const selInfo = c => S.flow.sel.length
  ? `${S.flow.sel.join(', ')} · ${S.flow.sel.length}석 · <b class="num">${won(c.price * S.flow.sel.length)}</b>`
  : '<span class="muted">좌석을 눌러 골라 주세요</span>';

V.seats = ({ id }) => {
  const c = CO(id), f = S.flow;
  if (!f || f.cid !== id || Date.now() > f.entryUntil)
    return `<div class="empty"><p>입장 토큰이 없어요. 대기열을 거쳐야 좌석을 고를 수 있어요.</p><button class="btn btn-primary" data-act="book" data-id="${id}">대기열 들어가기</button></div>`;
  const map = seatMap(id);
  const rows = 'ABCDEFG'.split('').map(r => `<div class="srow"><span class="rl">${r}</span>${Array.from({ length: 12 }, (_, i) => {
    const k = `${r}-${i + 1}`, st = f.sel.includes(k) ? 'sel' : map[k];
    return (i === 6 ? '<span class="gap"></span>' : '') + `<button class="seat ${st}" data-act="seat" data-v="${k}" aria-label="${r}열 ${i + 1}번 ${SEAT_LABEL[st]}" ${st === 'paid' ? 'disabled' : ''}>${i + 1}</button>`;
  }).join('')}</div>`).join('');
  return `
<div class="page-head"><div><p class="eyebrow">${md(c.date)} ${c.time} · ${esc(c.venue)}</p><h1>좌석 선택</h1></div><span class="timer" id="entryT">입장 시간 10:00</span></div>
<div class="split">
  <div class="panel sec">
    ${S.stages[c.venue] ? stageDrawn(S.stages[c.venue]) : '<div class="stage">STAGE</div>'}
    <div class="seatmap-wrap"><div class="seatmap">${rows}</div></div>
    <div class="legend"><span><i style="background:var(--seat)"></i>선택 가능</span><span><i style="background:var(--accent)"></i>내 선택</span>
      <span><i style="background:repeating-linear-gradient(45deg,var(--warn-weak) 0 4px,var(--seat) 4px 8px)"></i>다른 사람이 결제 중</span><span><i style="background:var(--seat-taken)"></i>예매 완료</span></div>
  </div>
  <aside class="panel sec">
    <h2 style="font-size:17px">선택한 좌석</h2>
    <p id="selInfo">${selInfo(c)}</p>
    <button class="btn btn-primary" data-act="hold" ${f.sel.length ? '' : 'disabled'}>좌석 잡고 결제하기</button>
    <p class="tag">한 번에 2석까지 고를 수 있어요. 좌석을 잡으면 5분 동안 다른 사람이 고를 수 없어요.</p>
    ${dev(`SET concert:lock:${id}:{seat} NX PX 3000 → seat HELD (TTL 5분) → 락 해제`)}
  </aside>
</div>`;
};
AFTER.seats = () => {
  if (!$('#entryT')) return;
  const tick = () => {
    const left = S.flow.entryUntil - Date.now();
    if (left <= 0) { const id = S.flow.cid; S.flow = null; toast('입장 시간이 끝났어요. 대기열에 다시 들어가 주세요'); go('concert', { id }); return; }
    $('#entryT').textContent = '입장 시간 ' + mmss(left);
    $('#entryT').classList.toggle('warn', left < 120000);
  };
  tick(); timers.push(setInterval(tick, 1000));
};

function release() { const f = S.flow, map = seatMap(f.cid); f.sel.forEach(k => { map[k] = 'free'; }); f.sel = []; f.holdUntil = 0; }

V.pay = ({ id }) => {
  const c = CO(id), f = S.flow;
  if (!f || !f.holdUntil) return `<div class="empty"><p>잡아 둔 좌석이 없어요.</p><button class="btn" data-go="concert" data-id="${id}">공연으로 돌아가기</button></div>`;
  return `
<div class="page-head"><div><p class="eyebrow">${esc(c.title)}</p><h1>결제</h1></div><span class="timer" id="holdT">좌석 유지 5:00</span></div>
<div class="split">
  <form class="panel form" data-submit="pay">
    <h2>결제 수단</h2>
    ${[['card', '신용·체크카드'], ['bank', '계좌이체'], ['easy', '간편결제']].map(([v, l], i) => `<label class="check" for="m-${v}"><input type="radio" name="method" id="m-${v}" value="${v}" ${i === 0 ? 'checked' : ''}> ${l}</label>`).join('')}
    <label class="check fail" for="failsim"><input type="checkbox" id="failsim" name="fail"> 결제 실패 상황 보기</label>
    <button class="btn btn-primary" type="submit" id="payBtn">${won(c.price * f.sel.length)} 결제하기</button>
    <p class="tag">실제 결제는 일어나지 않아요. 프로토타입용 더미 결제예요.</p>
    ${dev('더미 결제 → 성공: booking PAID · outbox concert.booked / 실패: HELD 좌석 보상 해제')}
  </form>
  <aside class="panel sec"><h2 style="font-size:17px">예매 정보</h2>
    <dl class="kv"><dt>공연</dt><dd>${esc(c.title)}</dd><dt>일시</dt><dd>${md(c.date)} ${c.time}</dd><dt>장소</dt><dd>${esc(c.venue)}</dd>
      <dt>좌석</dt><dd>${f.sel.join(', ')}</dd><dt>금액</dt><dd class="num">${won(c.price)} × ${f.sel.length}</dd></dl>
  </aside>
</div>`;
};
AFTER.pay = () => {
  if (!$('#holdT')) return;
  const tick = () => {
    const left = S.flow.holdUntil - Date.now();
    if (left <= 0) { release(); toast('5분이 지나 좌석이 풀렸어요. 다시 골라 주세요'); go('seats', { id: S.flow.cid }); return; }
    $('#holdT').textContent = '좌석 유지 ' + mmss(left);
    $('#holdT').classList.toggle('warn', left < 60000);
  };
  tick(); timers.push(setInterval(tick, 1000));
};

V.done = ({ id }) => {
  const b = S.bookings.find(x => x.id === id), c = CO(b.cid);
  return `
<div class="queue">
  <p class="eyebrow">예매 확정</p>
  <h1 class="display-s">예매가 끝났어요</h1>
  <div class="panel" style="width:100%;text-align:left"><dl class="kv">
    <dt>예매 번호</dt><dd class="mono">${b.id}</dd><dt>공연</dt><dd>${esc(c.title)}</dd><dt>일시</dt><dd>${md(c.date)} ${c.time}</dd>
    <dt>장소</dt><dd>${esc(c.venue)}</dd><dt>좌석</dt><dd>${b.seats.join(', ')}</dd><dt>결제 금액</dt><dd class="num">${won(b.total)}</dd></dl></div>
  ${dev('booking PAID → 분산 락 해제 → concert.booked 발행 → Member · AI 구독')}
  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
    <button class="btn btn-primary" data-act="toBookings">예매 내역 보기</button><button class="btn" data-go="concerts">다른 공연 보기</button></div>
</div>`;
};
</script>

<script>
/* ===== 음반 · LP ===== */
const eul = w => w + (hasB(w) ? '을' : '를');
const coverMini = al => `<div class="mini-cover">${cover(al)}</div>`;
const lpLi = al => {
  const st = stockState(al), min = al.stock.length ? Math.min(...al.stock.map(x => x[1])) : null;

    <span class="end">${min ? `<span class="num">${won(min)}~</span>` : ''}<span class="pill ${st[1]}">${st[0]}</span></span></button>`;

V.albums = () => {
  const isNew = S.atab === '신보';

const SUGGEST = ['분위기 있는 인디 밴드 추천해줘', '재즈 느낌 나는 밴드 있어?', '내 취향에 맞는 공연 알려줘', '지금 살 수 있는 LP 추천해줘', '회원탈퇴하는 방법 알려줘'];
const MOOD = ['드림팝', '슈게이징', '포크', '재즈 인디', '포스트록'];
function aiAnswer(q) {
  // 탈퇴는 안내와 버튼만. 실제 탈퇴는 사용자가 버튼 → 확정을 눌러야 실행 (챗봇 도구로는 실행하지 않음)
  if (/탈퇴|계정\s*삭제/.test(q)) return {
    withdraw: true, ctx: ['회원 탈퇴 안내 · 실행은 버튼으로만'],
    text: `탈퇴하면 팔로우 ${followedIds().length}팀, 위시리스트 ${S.wish.size}장, 고른 취향, 예매 내역, 대화 기록이 모두 지워지고 되돌릴 수 없어요. 아래 버튼으로 바로 진행할 수 있어요.`
  };
  const ctx = [];
  if (S.user.genres.length) ctx.push('고른 장르 ' + S.user.genres.join('·'));
  if (followedIds().length) ctx.push('팔로우 ' + followedIds().length + '팀');
  if (!hasTaste()) ctx.push('취향 정보 없음 → 인기순');
  if (/공연|라이브|콘서트|페스티벌/.test(q)) {
    const pool = CONCERTS.filter(c => !isPast(c.date))
      .map(c => ({ c, s: Math.max(...c.artists.map(id => tasteScore(A(id)) + (following(id) ? 3 : 0))) }))
      .sort((x, y) => y.s - x.s || byDate(x.c, y.c)).slice(0, 3);
    ctx.push('Tool: 공연 조회');
    return { text: hasTaste() ? `취향에 가까운 순서로 다가오는 공연 ${pool.length}개를 골랐어요. 〈${pool[0].c.title}〉이 가장 잘 맞아요.` : '다가오는 공연을 날짜순으로 골랐어요.', concerts: pool.map(x => x.c.id), ctx };
  }
  if (/LP|엘피|음반|앨범|바이닐/i.test(q)) {
    const pool = ALBUMS.filter(al => stockState(al)?.[0] === '재고 있음').map(al => ({ al, s: tasteScore(A(al.artist)) })).sort((x, y) => y.s - x.s).slice(0, 3);
    ctx.push('Tool: LP 재고 조회');
    return { text: `지금 재고가 있는 LP 중에서 취향에 맞는 ${pool.length}장이에요.`, albums: pool.map(x => x.al.id), ctx };
  }
  const g = GENRES.find(x => q.includes(x.split(' ')[0]));
  let pool = ARTISTS;
  if (g) pool = ARTISTS.filter(a => a.genres.includes(g));
  else if (/분위기|비 오는|잔잔|새벽|밤|몽환/.test(q)) pool = ARTISTS.filter(a => a.genres.some(x => MOOD.includes(x)));
  let recs = recommend(3, pool);
  if (!recs.length) recs = pool.slice(0, 3).map(a => ({ a, pct: null }));
  ctx.push(`pgvector 유사도 검색 ${pool.length}팀`);
  const basis = S.user.genres.length ? `고른 장르(${S.user.genres.join(', ')})` : '팔로우한 밴드';
  return {
    text: hasTaste() ? `${eul(basis)} 기준으로 ${recs.length}팀을 골랐어요. 이미 팔로우한 밴드는 뺐어요.` : '아직 취향 정보가 없어서 팔로워가 많은 순서로 골랐어요. MY에서 취향을 고르면 더 잘 맞춰 드릴게요.',
    artists: recs.map(r => ({ id: r.a.id, pct: r.pct, reason: hasTaste() ? why(r.a) : null })), ctx
  };
}

    <p class="tag">꼭짓점 <b class="num">${n}</b>개 · 3개부터 무대 모양이 닫혀요. 곡선은 점을 촘촘히 찍으면 돼요.</p>
  </div>
  <aside class="panel sec">
    <h2 style="font-size:17px">좌석 화면 미리보기</h2>
    <div>${n >= 3 ? stageDrawn(a.pts) : '<div class="stage">STAGE</div>'}<div class="mini-seats" aria-hidden="true">${'<i></i>'.repeat(84)}</div></div>
    <p class="tag">${esc(a.venue)} 좌석 선택 화면에 이렇게 보여요. 저장되는 건 꼭짓점 좌표뿐이고 밑그림 이미지는 올리지 않아요.</p>
    <button class="btn btn-primary" data-act="saveStage" ${n >= 3 ? '' : 'disabled'}>저장</button>
    ${dev('PUT /api/admin/venues/{venueId}/stage { points: [[x,y]…] (0~1) } → concert.venue.stage_shape (jsonb) · ROLE_ADMIN')}
  </aside>
</div>`;
};
</script>

<script>
/* ===== 새 소식 시뮬레이션 (Kafka 이벤트 → activity) ===== */
function nextEvent() {
  const fol = followedIds(), a = A(fol[S.simStep % Math.max(1, fol.length)] || 'a1'), step = S.simStep++ % 3;
  const sold = [...S.wish].map(AL).find(al => stockState(al)?.[0] === '품절');
  if (step === 2 && sold) {
    sold.stock[0][2] = 5;
    return { kind: 'LP', artist: sold.artist, text: `위시리스트의 〈${sold.title}〉 LP가 ${sold.stock[0][0]}에 다시 들어왔어요`, go: ['album', sold.id] };
  }
  if (step === 0) return { kind: '신보', artist: a.id, text: `${a.name} 새 싱글 〈${['겨울 주파수', '첫눈 예보', '작은 방송국'][S.simStep % 3]}〉 발매`, go: ['artist', a.id] };
  return { kind: '공연', artist: a.id, text: `${a.name} 추가 공연 오픈 · 12.27 (일) 롤링홀`, go: ['artist', a.id] };
}

/* ===== 라우터 ===== */
const NAV = [['home', '홈'], ['artists', '아티스트'], ['concerts', '공연'], ['albums', '음반·LP'], ['my', 'MY']];
const SECTION = { home: 'home', artists: 'artists', artist: 'artists', concerts: 'concerts', concert: 'concerts', queue: 'concerts', seats: 'concerts', pay: 'concerts', done: 'concerts', albums: 'albums', album: 'albums', my: 'my' };
function go(route, p = {}) {
  timers.forEach(t => { clearInterval(t); clearTimeout(t); }); timers = [];
  if (NARROW.matches) S.chatOpen = false;
  S.route = route; S.p = p; render(); window.scrollTo(0, 0);
}
function render() {
  document.body.classList.toggle('bare', ['landing', 'signup', 'genre', 'pickArtists', 'admin'].includes(S.route));
  $('#loginBtn').hidden = S.route !== 'landing';
  $('#app').innerHTML = V[S.route](S.p);
  drawNav();
  drawChat();
  if (AFTER[S.route]) AFTER[S.route]();
}
function rerender() { const y = window.scrollY; render(); window.scrollTo(0, y); }
function drawNav() {
  const cur = SECTION[S.route], n = S.activity.filter(x => x.at > S.lastSeen).length;
  const html = NAV.map(([r, l]) => `<button data-go="${r}" ${cur === r ? 'aria-current="page"' : ''}>${l}${r === 'home' && n ? `<span class="badge">${n}</span>` : ''}</button>`).join('');
  $('#nav').innerHTML = html; $('#tabbar').innerHTML = html;
}
const toggle = (set, v) => { if (set.has(v)) { set.delete(v); return false; } set.add(v); return true; };
const flip = (arr, v) => { const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); };

/* ===== 동작 ===== */
const ACT = {
  sso(d, el) {
    const label = d.v === 'kakao' ? '카카오' : 'Google';
    document.querySelectorAll('.sso').forEach(b => { b.disabled = true; });
    el.textContent = `${label} 계정 확인 중…`;
    timers.push(setTimeout(() => {
      S.user.provider = d.v;
      S.user.email = d.v === 'kakao' ? 'listener@kakao.com' : 'listener@gmail.com';
      toast(`${label} 계정으로 가입했어요. 이제 취향을 골라 주세요`);
      go('genre');
    }, 900));
  },
  pickTop(d) {
    flip(S.draft.tops, d.v);
    if (!S.draft.tops.includes(d.v)) { const subs = GENRE_TREE.find(t => t.name === d.v).subs; S.draft.genres = S.draft.genres.filter(g => !subs.includes(g)); }
    rerender();
  },
  pickGenre(d) { flip(S.draft.genres, d.v); rerender(); },
  toArtists() { go('pickArtists'); },
  pickArtist(d) {
    flip(S.draft.artists, d.id);
    if (S.draft.artists.includes(d.id) && !S.draft.revealed.includes(d.id)) S.draft.revealed.push(d.id);
    rerender();
  },
  finishOnb() {
    const now = Date.now();
    S.user.genres = pickedGenres();
    S.draft.artists.forEach(id => { S.user.follows[id] = now; });
    S.user.onboarded = true; S.lastSeen = now;
    toast(`취향을 저장했어요. 장르 ${S.user.genres.length}개, 밴드 ${S.draft.artists.length}팀을 추천에 써요`);
    go('home');
  },
  skipOnb() { toast('건너뛰었어요. MY › 취향 설정에서 언제든 고를 수 있어요'); go('home'); },
  follow(d) {
    const on = following(d.id), n = A(d.id).name;
    if (on) delete S.user.follows[d.id]; else S.user.follows[d.id] = Date.now();
    toast(on ? `${n} 팔로우를 끊었어요` : `${eul(n)} 팔로우해요. 새 소식은 홈에 모아 드릴게요`);
    rerender();
  },
  feedFilter(d) { S.feedFilter = d.v; rerender(); },
  simulate() {
    toast('1초 뒤 새 소식이 도착해요. 다른 화면으로 가 있어도 돼요');
    setTimeout(() => {
      S.activity.push({ ...nextEvent(), at: Date.now() });
      if (S.route === 'home') rerender(); else drawNav();
      toast('새 소식 1건이 도착했어요');
    }, 1200);
  },
  gfilter(d) { S.gfilter = d.v; rerender(); },
  cview(d) { S.cview = d.v; rerender(); },
  month(d) { S.month = Math.min(11, Math.max(9, S.month + Number(d.v))); rerender(); },
  region(d) { S.region = d.v; rerender(); },
  ctype(d) { S.ctype = d.v; rerender(); },
  atab(d) { S.atab = d.v; rerender(); },
  mtab(d) { S.mtab = d.v; rerender(); },
  book(d) { go('queue', { id: d.id }); },
  interest(d) { toast(toggle(S.interest, d.id) ? '관심 공연에 담았어요. MY에서 모아 볼 수 있어요' : '관심 공연에서 뺐어요'); rerender(); },
  wish(d) {
    const on = toggle(S.wish, d.id), st = stockState(AL(d.id))[0];
    toast(on ? (st === '품절' ? '재입고되면 홈 새 소식으로 알려드려요' : st === '발매 전' ? '판매가 시작되면 알려드려요' : '위시리스트에 담았어요') : '위시리스트에서 뺐어요');
    rerender();
  },
  own(d) { toggle(S.owned, d.id); rerender(); },
  seat(d, el) {
    const f = S.flow, map = seatMap(f.cid), k = d.v;
    if (map[k] === 'held') { toast('다른 분이 결제 중인 좌석이에요. 5분 안에 결제되지 않으면 다시 열려요'); return; }
    if (f.sel.includes(k)) flip(f.sel, k);
    else if (f.sel.length >= 2) { toast('한 번에 2석까지 고를 수 있어요'); return; }
    else f.sel.push(k);
    el.classList.toggle('sel', f.sel.includes(k));
    $('#selInfo').innerHTML = selInfo(CO(f.cid));
    $('[data-act="hold"]').disabled = !f.sel.length;
  },
  hold() {
    const f = S.flow, map = seatMap(f.cid);
    f.sel.forEach(k => { map[k] = 'mine'; });
    f.holdUntil = Date.now() + 300000;
    go('pay', { id: f.cid });
  },
  pay(form) {
    const btn = $('#payBtn'), fail = form.fail.checked, f = S.flow, c = CO(f.cid);
    btn.disabled = true; btn.textContent = '결제 중…';
    timers.push(setTimeout(() => {
      if (fail) { release(); toast('결제에 실패해서 잡아 둔 좌석을 풀었어요. 다시 골라 주세요'); go('seats', { id: c.id }); return; }
      const map = seatMap(c.id); f.sel.forEach(k => { map[k] = 'paid'; });
      const bk = { id: 'BK-261008-' + String(S.bookings.length + 1).padStart(4, '0'), cid: c.id, seats: [...f.sel], total: c.price * f.sel.length, status: 'PAID' };
      S.bookings.unshift(bk); S.flow = null;
      go('done', { id: bk.id });
    }, 900));
  },
  toBookings() { S.mtab = '예매 내역'; go('my'); },
  cancel(d) {
    const b = S.bookings.find(x => x.id === d.id), map = seatMap(b.cid);
    b.status = 'CANCELLED'; b.seats.forEach(k => { map[k] = 'free'; });
    toast('예매를 취소했어요. 좌석은 다른 분이 고를 수 있게 풀렸어요');
    rerender();
  },
  tasteGenre(d) { flip(S.user.genres, d.v); rerender(); },
  saveTaste() { toast('취향을 저장했어요. AI 추천에 바로 반영돼요'); },
  openTaste() { S.mtab = '취향 설정'; go('my'); },
  openChat() { S.chatOpen = true; drawChat(true); if (!NARROW.matches) $('#askq').focus(); },
  toggleChat() { if (S.chatOpen) { S.chatOpen = false; drawChat(); } else ACT.openChat(); },
  suggest(d) { ACT.ask({ q: { value: d.v } }); },
  ask(f) {
    const q = f.q.value.trim(); if (!q) return;
    f.q.value = '';
    S.chat.push({ me: true, text: q }, { typing: true });
    drawChat(true);
    setTimeout(() => { S.chat.pop(); S.chat.push(aiAnswer(q)); drawChat(true); }, 900);
  },
  hum(d, el) {
    const rec = { me: true, rec: true }, wait = { typing: true, hum: true };
    el.disabled = true; S.chat.push(rec); drawChat(true);
    setTimeout(() => {
      const i = S.chat.indexOf(rec); if (i < 0) { el.disabled = false; return; }
      S.chat.splice(i, 1, { me: true, text: '허밍으로 찾기 · 6초' }); S.chat.push(wait); drawChat(true);
      setTimeout(() => {
        const j = S.chat.indexOf(wait); el.disabled = false; if (j < 0) return;
        S.chat.splice(j, 1, { ...HUM_ANSWER }); drawChat(true);
      }, 1600);
    }, 2600);
  },
  withdrawAsk(d) { S.chat[d.i].confirm = true; drawChat(); },
  withdrawCancel(d) { S.chat[d.i].confirm = false; drawChat(); },
  withdraw() {
    Object.assign(S, {
      user: { nick: '새벽청취자', email: '', provider: null, genres: [], follows: {}, onboarded: false },
      draft: { tops: [], genres: [], artists: [], revealed: [] },
      wish: new Set(), owned: new Set(), interest: new Set(), bookings: [], activity: [], flow: null, chat: [], chatOpen: false
    });
    toast('탈퇴했어요. 그동안 이용해 주셔서 고마워요');
    go('landing');
  },
  venue(d) { S.admin ={ venue: d.v, img: null, pts: (S.stages[d.v] || []).map(p => [...p]) }; rerender(); },
  sampleImg() { S.admin.img = SAMPLE_PLAN; rerender(); },
  addPt(d, el, e) {
    const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(el.getScreenCTM().inverse());
    const n = v => Math.min(1, Math.max(0, +v.toFixed(3)));
    S.admin.pts.push([n(p.x / CW), n(p.y / CH)]); rerender();
  },
  undoPt() { S.admin.pts.pop(); rerender(); },
  clearPts() { S.admin.pts = []; rerender(); },
  saveStage() {
    const a = S.admin; S.stages[a.venue] = a.pts.map(p => [...p]);
    toast(`${a.venue} 무대 모양을 저장했어요. 이 공연장 좌석 화면에 바로 반영돼요`); rerender();
  }
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-act]');
  if (!t || t.disabled) return;
  if (t.dataset.go) { go(t.dataset.go, { id: t.dataset.id }); return; }
  if (ACT[t.dataset.act]) ACT[t.dataset.act](t.dataset, t, e);
});
document.addEventListener('submit', e => { e.preventDefault(); const f = e.target; if (ACT[f.dataset.submit]) ACT[f.dataset.submit](f); });
document.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; $('#artistGrid').innerHTML = artistGrid(); } });
document.addEventListener('change', e => { if (e.target.id === 'stageImg' && e.target.files[0]) { S.admin.img = URL.createObjectURL(e.target.files[0]); rerender(); } });
$('#devmode').addEventListener('change', e => document.body.classList.toggle('devmode', e.target.checked));

render();
</script>
</body>
</html>
