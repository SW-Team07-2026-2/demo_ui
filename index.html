<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>인디 아카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 상단 고정 내비 + 1120px 본문 · 폰에서는 하단 탭바 · 다크 우선 (기존 IA·온보딩 톤 계승) */
:root{
  --bg:#0f0e14; --surface:#18161f; --surface-2:#221f2c; --line:#2e2a3a;
  --fg:#ecebf3; --muted:#958fab; --accent:#8b7cf6; --accent-weak:#272143; --on-accent:#ffffff;
  --ok:#55c483; --ok-weak:#15301f; --warn:#e6ab43; --warn-weak:#33280f; --bad:#ef6f76; --bad-weak:#3a1b1e;
  --seat:#2b2738; --seat-taken:#3a3646;
  --font-display:'Black Han Sans','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:6px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f4f9; --surface:#ffffff; --surface-2:#eeecf5; --line:#dfdbea;
    --fg:#17151f; --muted:#666079; --accent:#5d4ddb; --accent-weak:#e8e4fc; --on-accent:#ffffff;
    --ok:#22804a; --ok-weak:#ddf2e5; --warn:#9a6409; --warn-weak:#f8ecd2; --bad:#c23842; --bad-weak:#fbe2e4;
    --seat:#e4e1ee; --seat-taken:#c9c5d6;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f5f4f9; --surface:#ffffff; --surface-2:#eeecf5; --line:#dfdbea;
  --fg:#17151f; --muted:#666079; --accent:#5d4ddb; --accent-weak:#e8e4fc; --on-accent:#ffffff;
  --ok:#22804a; --ok-weak:#ddf2e5; --warn:#9a6409; --warn-weak:#f8ecd2; --bad:#c23842; --bad-weak:#fbe2e4;
  --seat:#e4e1ee; --seat-taken:#c9c5d6;
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
p{margin:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono)}

/* ---------- 상단 · 하단 내비 ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding-inline:16px;height:58px;display:flex;align-items:center;gap:24px}
.logo{background:none;border:0;padding:0;font-family:var(--font-display);font-size:21px;letter-spacing:-.5px;color:var(--fg);white-space:nowrap}
.logo i{font-style:normal;color:var(--accent)}
.nav{display:flex;gap:2px;flex:1;min-width:0}
.nav button{background:none;border:0;padding:8px 12px;border-radius:var(--r);color:var(--muted);font-weight:500;position:relative;white-space:nowrap}
.nav button:hover{color:var(--fg)}
.nav button[aria-current="page"]{color:var(--fg);background:var(--surface-2)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;margin-left:4px;font-variant-numeric:tabular-nums}
.tools{display:flex;align-items:center;gap:12px;margin-left:auto}
.devtoggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;cursor:pointer}
.proto{font-family:var(--font-mono);font-size:11px;color:var(--muted);border:1px dashed var(--line);padding:3px 8px;border-radius:4px;white-space:nowrap}
.tabbar{display:none}
body.bare .nav,body.bare .tabbar{display:none!important}

/* ---------- 본문 ---------- */
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:32px 56px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:600}
.display{font-family:var(--font-display);font-weight:400;font-size:clamp(34px,5vw,52px);line-height:1.15;letter-spacing:-.5px}
.display-s{font-family:var(--font-display);font-weight:400;font-size:clamp(26px,3.6vw,34px);line-height:1.2}
.lead{color:var(--muted);font-size:16px;max-width:60ch}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:24px}
.page-head h1{font-size:26px;font-weight:700}
.sec{display:grid;gap:14px}
.sec + .sec{margin-top:40px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-head h2{font-size:17px;font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
.split > *{min-width:0}

/* ---------- 버튼 · 칩 · 상태 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--r);padding:10px 18px;font-weight:600;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{filter:brightness(1.08);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn-s{padding:6px 12px;font-size:13px}
.btn.on{background:var(--accent-weak);border-color:var(--accent);color:var(--accent)}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--fg)}
.chip:hover{border-color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-weak);color:var(--ok)}
.pill.warn{background:var(--warn-weak);color:var(--warn)}
.pill.bad{background:var(--bad-weak);color:var(--bad)}
.pill.ac{background:var(--accent-weak);color:var(--accent)}
.tag{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--muted);font-weight:600;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:28px 20px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}

/* 개발 노트: API·이벤트 표시 (토글) */
.dev{display:none;font-family:var(--font-mono);font-size:11.5px;line-height:1.5;color:var(--warn);background:var(--warn-weak);padding:3px 8px;border-radius:4px;width:fit-content;max-width:100%;overflow-wrap:anywhere}
body.devmode .dev{display:inline-block}

/* ---------- 아바타 · 커버 ---------- */
.avatar{--s:44px;width:var(--s);height:var(--s);flex:none;border-radius:50%;display:inline-grid;place-items:center;background:linear-gradient(140deg,var(--c1),var(--c2));color:#fff;font-weight:700;font-size:calc(var(--s) * .4);text-shadow:0 1px 2px rgba(0,0,0,.35)}
.cover{position:relative;aspect-ratio:1;max-width:100%;border-radius:4px;overflow:hidden;background:linear-gradient(135deg,var(--c1),var(--c2));display:flex;align-items:flex-end;padding:10px;color:#fff;font-weight:700;font-size:13px;line-height:1.25}
.cover.v1::before{content:"";position:absolute;top:14%;right:14%;width:48%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.2)}
.cover.v2{background:repeating-linear-gradient(100deg,var(--c1) 0 14px,var(--c2) 14px 28px)}
.cover.v3{background:radial-gradient(circle at 28% 30%,var(--c2),var(--c1) 72%)}
.cover.v4::before{content:"";position:absolute;inset:auto -10% 30% -10%;height:22%;background:rgba(255,255,255,.16);transform:rotate(-8deg)}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),transparent 60%)}
.cover span{position:relative;z-index:1;text-shadow:0 1px 3px rgba(0,0,0,.4)}

/* ---------- 카드 그리드 ---------- */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.grid.albums{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.acard{display:grid;gap:12px;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;text-align:left;min-width:0}
.acard:hover{border-color:var(--muted)}
.acard .row{display:flex;align-items:center;gap:12px;min-width:0}
.acard .name{font-weight:700;font-size:16px;line-height:1.3}
.acard .sub{font-size:13px;color:var(--muted)}
.acard .why{font-size:13px;color:var(--fg);background:var(--surface-2);border-radius:var(--r);padding:8px 10px}
.acard .foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.alcard{display:grid;gap:8px;background:none;border:0;padding:0;text-align:left;min-width:0}
.alcard .t{font-weight:600;font-size:14px;line-height:1.35}
.alcard .s{font-size:12.5px;color:var(--muted)}
.match{font-family:var(--font-mono);font-size:12px;color:var(--accent);font-weight:500}

/* ---------- 리스트 ---------- */
.list{display:grid;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left;background:none;border:0;border-top:1px solid var(--line);width:100%;min-width:0}
.li:first-child{border-top:0}
button.li:hover{background:var(--surface-2)}
.li .main{flex:1;min-width:0;display:grid;gap:2px}
.li .main b{font-weight:600;overflow-wrap:anywhere}
.li .main small{color:var(--muted);font-size:13px}
.date{flex:none;width:52px;text-align:center;display:grid;line-height:1.15}
.date b{font-size:20px;font-variant-numeric:tabular-nums}
.date small{font-size:11.5px;color:var(--muted)}
.li .new{width:7px;height:7px;border-radius:50%;background:var(--bad);flex:none}

/* ---------- 폼 ---------- */
.form{display:grid;gap:8px}
.form h2{font-size:20px;margin-bottom:8px}
.form label{font-size:13px;color:var(--muted);font-weight:500;margin-top:6px}
.form input[type=text],.form input[type=email],.form input[type=password],.form select,.search{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px}
.form .btn{margin-top:14px}
.search{max-width:420px}
.check{display:flex;align-items:center;gap:8px;font-size:14px}

/* ---------- 가입 · 온보딩 ---------- */
.signup{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:56px;align-items:center;padding-block:24px}
.signup-copy{display:grid;gap:22px}
.points{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.points li{display:flex;gap:12px;align-items:baseline;color:var(--muted)}
.points b{color:var(--fg);font-family:var(--font-mono);font-size:12px;font-weight:500;width:34px;flex:none}
.onb{max-width:820px;margin:0 auto;display:grid;gap:22px}
.onb-foot{position:sticky;bottom:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;padding-inline:16px;margin-inline:-16px;background:color-mix(in srgb,var(--bg) 92%,transparent);border-top:1px solid var(--line)}
.pick{position:relative;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;min-width:0}
.pick.on{border-color:var(--accent);background:var(--accent-weak)}
.pick .ck{margin-left:auto;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--on-accent);flex:none}
.pick.on .ck{background:var(--accent);border-color:var(--accent)}
.saved{display:grid;gap:6px;font-size:13px;color:var(--muted)}
/* 약관 화면 · 푸터 (docs/25) */
.terms-doc{max-width:760px;display:grid;gap:10px}
.terms-doc h2{font-size:16px;margin-top:14px}
.terms-doc p,.terms-doc li{color:var(--muted)}
.terms-doc ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.terms-doc mark{background:var(--warn-weak);color:var(--warn);padding:0 4px;border-radius:3px}
.site-foot{border-top:1px solid var(--line);background:var(--surface)}
.foot-in{max-width:1120px;margin:0 auto;padding:28px 16px 88px;display:grid;gap:12px}
.foot-links{display:flex;flex-wrap:wrap;gap:6px 20px}
.foot-links button{background:none;border:0;padding:0;font-size:13px;color:var(--muted)}
.foot-links button:hover{color:var(--fg)}
.foot-links .pp{color:var(--fg);font-weight:700}
.tabs button.pp{color:var(--fg)}
.biz{display:flex;flex-wrap:wrap;gap:2px 16px;font-size:12px;color:var(--muted);line-height:1.7}
.biz i{font-style:normal;color:var(--warn)}

/* ---------- 첫 진입 (비로그인): 좌측 후킹 문구 · 우측 오늘 공연 ---------- */
.display.xl{font-size:clamp(40px,6.4vw,72px);line-height:1.08}
.tm{flex:none;width:52px;font-family:var(--font-mono);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--accent)}

/* ---------- 아티스트 상세 ---------- */
.hero-a{display:flex;flex-wrap:wrap;align-items:center;gap:20px 24px;padding-bottom:28px;border-bottom:1px solid var(--line);margin-bottom:28px}
.hero-a .meta{flex:1;min-width:220px;display:grid;gap:6px}
.hero-a h1{font-family:var(--font-display);font-weight:400;font-size:clamp(30px,4.4vw,42px)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{text-align:left;padding:10px 12px;border-top:1px solid var(--line)}
.table th{font-weight:500;color:var(--muted);font-size:12.5px;border-top:0}
.table td.r,.table th.r{text-align:right}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}

/* ---------- 공연 ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.cal .wd{padding:8px;font-size:12px;color:var(--muted);text-align:center;border-bottom:1px solid var(--line)}
.cal .d{min-height:92px;padding:6px;border-top:1px solid var(--line);border-left:1px solid var(--line);display:grid;align-content:start;gap:4px;min-width:0}
.cal .d:nth-child(7n+1){border-left:0}
.cal .d.out{background:var(--bg)}
.cal .d .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cal .d.today .n{color:var(--accent);font-weight:700}
.cal .ev{display:block;width:100%;text-align:left;font-size:11.5px;line-height:1.3;padding:3px 5px;border-radius:4px;border:0;background:var(--accent-weak);color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev.fest{background:var(--warn-weak);color:var(--warn)}
.poster{border-radius:10px;padding:28px;min-height:220px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;background:linear-gradient(150deg,var(--c1),var(--c2));color:#fff;position:relative;overflow:hidden}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6),transparent 70%)}
.poster > *{position:relative;z-index:1}
.poster h1{font-family:var(--font-display);font-weight:400;font-size:clamp(26px,4vw,38px);line-height:1.15}
.poster .tag{color:rgba(255,255,255,.85)}

/* 대기열 · 좌석 · 결제 */
.queue{max-width:520px;margin:24px auto;text-align:center;display:grid;gap:18px;justify-items:center}
.queue .big{font-family:var(--font-mono);font-size:64px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.bar{width:100%;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .35s}
.timer{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:13px;padding:4px 10px;border-radius:4px;background:var(--accent-weak);color:var(--accent);white-space:nowrap}
.timer.warn{background:var(--warn-weak);color:var(--warn)}
.stage{text-align:center;font-size:12px;letter-spacing:.3em;color:var(--muted);border:1px solid var(--line);border-radius:4px 4px 40px 40px;padding:8px;margin-bottom:18px}
/* 좌석 상태 색 — 배치도(.plan.pm) · 구역 확대 창(.secview.pm) 공용 */
.pm rect.free,.pm .free rect{fill:var(--ok)}
.pm rect.contested,.pm .contested rect{fill:color-mix(in srgb,var(--warn) 45%,var(--bg))}
.pm rect.paid,.pm .paid rect{fill:var(--seat-taken)}
.pm rect.mine,.pm .mine rect,.pm .on rect{fill:var(--accent)}
.plan.pm .sec-ol{fill:transparent}
.sec-pick{cursor:pointer}
.sec-pick:focus-visible{outline:none}
.pm .sec-pick:hover .sec-ol,.pm .sec-pick:focus-visible .sec-ol{fill:color-mix(in srgb,var(--accent) 12%,transparent);stroke:var(--accent);stroke-width:2}
.legend .lg-free{background:var(--ok)}
.legend .lg-on{background:var(--accent)}
.legend .lg-contested{background:color-mix(in srgb,var(--warn) 45%,var(--bg))}
.legend .lg-paid{background:var(--seat-taken)}
.notice{background:var(--warn-weak);color:var(--warn);border-radius:8px;padding:12px 16px;font-size:14px;font-weight:600}
.err{background:var(--bad-weak);color:var(--bad);border-radius:8px;padding:12px 14px;font-size:14px}
.confirm{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:14px}
.check.sim{color:var(--muted);font-size:13px}
/* 구역 확대 창 — 넓은 화면은 가운데 창, 폰은 아래에서 올라오는 시트 */
.sheet{width:min(1040px,calc(100vw - 32px));max-width:none;max-height:calc(100dvh - 32px);padding:0;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);overflow:auto}
.sheet::backdrop{background:rgba(0,0,0,.6)}
.sheet-in{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;padding:20px;align-items:start}
.sheet-in.one{grid-template-columns:minmax(0,1fr)}
.sheet-in > *{min-width:0}
.sheet-head{display:flex;align-items:center;gap:10px}
.sheet-head > div{flex:1;min-width:0}
.sheet-head h2{font-size:20px}
.secview-wrap{overflow:auto;max-height:52vh}
.secview{display:block;height:auto;margin:0 auto}
.secview text{font-size:3.4px;font-family:var(--font-mono);text-anchor:middle;dominant-baseline:central;fill:var(--bg);pointer-events:none}
.secview .on text,.secview .mine text{fill:var(--on-accent)}
.secview .paid text{fill:transparent}
.secview .rowl{fill:var(--muted);font-size:4px}
.secview [role=button]{cursor:pointer}
.secview [role=button]:focus-visible{outline:none}
.secview [role=button]:hover rect,.secview [role=button]:focus-visible rect,.secview .on rect{stroke:var(--fg);stroke-width:2px;vector-effect:non-scaling-stroke}
@media (max-width:760px){
  .sheet{width:100%;max-width:100%;max-height:92dvh;margin:auto 0 0;border-radius:14px 14px 0 0;border-bottom:0}

.eq{display:inline-flex;align-items:flex-end;gap:3px;height:14px;margin-right:8px;vertical-align:-1px}

.admin-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}

.form input[type=number],.form input[type=date],.form input[type=time],.form input[type=url]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px}

  if (route === 'lpay') {

    return { kind: 'LP', name: `${al.title} LP`, artist: al.artist, price: o ? o[1] : 0, stock: o ? o[2] : 0, qty: 1,
      back: ['album', id, '음반으로 돌아가기'], more: ['albums', '', '다른 음반 보기'], take: q => { o[2] -= q; } };

<script>
/* ===== 공연 · 예매 ===== */
const mmss = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const chip = (act, v, cur, label = v) => `<button class="chip ${cur === v ? 'on' : ''}" data-act="${act}" data-v="${v}">${label}</button>`;

function calendar(y, m, list) {
  const start = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate(), cells = [];
  for (let i = 0; i < start; i++) cells.push('<div class="d out"></div>');
  for (let d = 1; d <= days; d++) {
    const ds = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const evs = list.filter(c => c.date === ds);
    cells.push(`<div class="d ${ds === '2026-10-08' ? 'today' : ''}"><span class="n">${d}</span>${evs.map(c => `<button class="ev ${c.type === '페스티벌' ? 'fest' : ''}" data-go="concert" data-id="${c.id}" title="${esc(c.title)}">${esc(names(c.artists))}</button>`).join('')}</div>`);
  }
  while (cells.length % 7) cells.push('<div class="d out"></div>');
  return `<div class="sec-head"><button class="btn btn-s" data-act="month" data-v="-1" ${m <= 9 ? 'disabled' : ''} aria-label="이전 달">‹</button>
    <h2 class="num">${y}년 ${m + 1}월</h2><button class="btn btn-s" data-act="month" data-v="1" ${m >= 11 ? 'disabled' : ''} aria-label="다음 달">›</button></div>
    <div class="cal">${WD.map(w => `<div class="wd">${w}</div>`).join('')}${cells.join('')}</div>`;
}

V.concerts = () => {
  const list = CONCERTS.filter(c => (S.region === '전체' || c.region === S.region) && (S.ctype === '전체' || c.type === S.ctype)).sort(byDate);
  const inMonth = list.filter(c => day(c.date).getMonth() === S.month);
  const shown = S.cview === '캘린더' ? inMonth : list;
  return `

AFTER.queue = () => {
  const c = CO(S.p.id), total = c.queue; let pos = total;
  const t = setInterval(() => {
    if (document.hidden) return;   // 앱을 내리면 폴링이 멈춤 — 돌아왔을 때 15초가 지났으면 이탈 (visibilitychange)
    pos = Math.max(0, pos - Math.ceil(total * (0.05 + Math.random() * 0.08)));
    $('#qPos').textContent = pos.toLocaleString();
    $('#qBar').style.width = (100 - pos / total * 100) + '%';
    if (pos > 0) return;
    clearInterval(t);
    $('#qTitle').textContent = '내 차례예요';
    $('#qSub').textContent = '입장 토큰을 받았어요. 10분 안에 좌석을 골라 주세요';

    timers.push(setTimeout(() => go('seats', { id: c.id }), 1100));
  }, 700);
  timers.push(t);
};

/* 좌석 — 무대 모양 배치도 → 구역을 누르면 무대 정면으로 돌린 확대 창 → 좌석 고르기(화면만) → 선택완료(N10 · 좌석은 잡지 않음)
   → 결제(N16 · 같은 좌석을 고른 사람 중 먼저 결제한 한 명만). 좌석 상태 = 미선택 · 경합 · 선택완료 */
// 공연장 구역: 관리자가 그린 구역이 있으면 그걸, 없으면 관리자 화면 샘플 도면의 A~D 구역 (400×300 좌표)
const SAMPLE_SECS = { A: [[68, 90], [121, 151], [76, 190], [23, 129]], B: [[140, 92], [260, 92], [260, 196], [140, 196]],
  C: [[332, 90], [279, 151], [324, 190], [377, 129]], D: [[60, 214], [340, 214], [360, 266], [40, 266]] };
function venueSecs(venue) {
  const drawn = Object.values(S.sections).filter(s => s.venue === venue);
  return drawn.length ? drawn : Object.entries(SAMPLE_SECS).map(([name, P]) => {
    const pts = P.map(([x, y]) => [x / CW, y / CH]);
    return { venue, floor: '1층', name, pts, ...layoutSeats(pts, stageOf(venue)) };
  });
}
const secKey = s => `${s.floor}|${s.name}`;
const secOf = (c, k) => venueSecs(c.venue).find(s => secKey(s) === k);
const secName = n => /구역$/.test(n) ? n : n + '구역';
const seatKey = (s, t) => `${FLOORS[s.floor] || s.floor}-${s.name}-${t.row}-${t.num}`;
const seatLabel = (s, t) => `${secName(s.name)} ${t.row}열 ${t.num}번`;
// 좌석 상태(미선택 free · 경합 contested · 선택완료 paid)는 공연별로 처음 볼 때 정해 두고, 결제 · 취소가 바꿈
const seatMap = cid => S.seats[cid] || (S.seats[cid] = {});
function seatSt(cid, key) {
  const m = seatMap(cid);
  if (!m[key]) {
    let h = 2166136261; for (const ch of cid + key) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
    h = Math.imul(h ^ h >>> 13, 0x5bd1e995); h ^= h >>> 15;
    const x = (h >>> 0) / 4294967296;
    m[key] = x < .3 ? 'paid' : x < .36 ? 'contested' : 'free';
  }
  return m[key];
}
const seatCls = (f, key) => f.sel?.key === key ? 'mine' : seatSt(f.cid, key);
const freeIn = (cid, s) => s.seats.filter(t => seatSt(cid, seatKey(s, t)) !== 'paid').length;   // 경합도 고를 수 있음
const SEAT_LABEL = { free: '미선택', contested: '경합 · 다른 분도 고른 좌석', paid: '선택완료 · 예매 끝남', mine: '내가 고른 좌석' };
const seatLegend = `<div class="legend"><span><i class="lg-free"></i>미선택</span><span><i class="lg-contested"></i>경합 (고를 수 있음)</span>
  <span><i class="lg-paid"></i>선택완료</span><span><i class="lg-on"></i>내가 고른 좌석</span></div>`;
const takenErr = `<p class="err" role="alert"><b>이미 선택된 좌석입니다.</b><br>같은 좌석을 고른 다른 분이 먼저 결제를 끝냈어요. 결제는 되지 않았어요. 다른 좌석을 골라 주세요.</p>`;

V.seats = ({ id }) => {

  if (!f || f.cid !== id || Date.now() > f.entryUntil)

    ${dev('화면 복원 = sessionStorage 의 { bookingId, seatId, expiresAt } 또는 N12 · 선택 취소 = N13 POST /api/concerts/bookings/{id}/cancel (결제 무효화) · 다른 좌석을 선택완료하면 N10 이 이전 선택을 취소')}` : `
    ${f.err?.code === 'SEAT_UNAVAILABLE' ? takenErr : ''}
    <h2 style="font-size:17px">구역을 골라 주세요</h2>
    <p class="muted">배치도에서 구역을 누르면 그 구역을 무대 정면 방향으로 돌려서 크게 보여줘요.</p>
    <div class="list">${secs.map(s => `<button class="li" data-act="openSec" data-v="${esc(secKey(s))}"><span class="main"><b>${esc(secName(s.name))}</b><small>${s.rows}열 · ${s.seats.length}석</small></span>

  return `

<div class="split">

let loadSeq = 0;
function modalInner() {
  const f = S.flow, c = CO(f.cid), s = secOf(c, f.sec);
  const head = `<div class="sheet-head"><div><p class="eyebrow">${s.floor} · 무대를 정면으로 보게 돌렸어요</p><h2 id="secTitle">${esc(secName(s.name))}</h2></div>
    <span class="timer" id="entryT2">입장 시간 ${mmss(f.entryUntil - Date.now())}</span><button class="btn btn-s" data-act="closeSec">닫기</button></div>`;
  if (f.loading) return `<div class="sheet-in one"><div class="sec">${head}<div class="empty"><p>좌석 상태를 불러오는 중이에요…</p></div>
    ${dev('N7 다시 조회 — 이때 뒤로가기 = 창만 닫고 AbortController.abort() · 늦게 온 응답은 버림 (조회라 서버에 되돌릴 것 없음)')}</div></div>`;
  // 배치도에서 무대를 바라보던 기울기(s.rot)만큼 반대로 돌리면 앞줄이 위, 좌석 번호가 왼쪽 → 오른쪽
  const r = -s.rot * Math.PI / 180, cos = Math.cos(r), sin = Math.sin(r), [cx, cy] = mid(toC(s.pts));
  const pts = s.seats.map(t => { const x = t.x * CW - cx, y = t.y * CH - cy; return { t, x: cx + x * cos - y * sin, y: cy + x * sin + y * cos }; });
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const x0 = Math.min(...xs) - SEAT.px * 1.5, y0 = Math.min(...ys) - SEAT.py * .7;
  const w = Math.max(...xs) + SEAT.px * .7 - x0, h = Math.max(...ys) + SEAT.py * .7 - y0;
  const rows = pts.filter(p => p.t.num === 1).map(p => `<text class="rowl" x="${(p.x - SEAT.px).toFixed(1)}" y="${p.y.toFixed(1)}">${p.t.row}</text>`).join('');
  const seats = pts.map(({ t, x, y }) => {
    const k = seatKey(s, t), st = seatCls(f, k), l = seatLabel(s, t), on = f.pick === k;
    const attrs = st === 'paid' ? 'role="img"' : `data-act="pickSeat" data-v="${esc(k)}" data-l="${esc(l)}" role="button" tabindex="0" aria-pressed="${on}"`;
    return `<g class="${st}${on ? ' on' : ''}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})" ${attrs} aria-label="${esc(l)} · ${SEAT_LABEL[st]}"><rect x="${-SEAT.w / 2}" y="${-SEAT.h / 2}" width="${SEAT.w}" height="${SEAT.h}" rx="1.2"/><text>${t.num}</text></g>`;
  }).join('');
  return `<div class="sheet-in"><div class="sec">${head}
    <div class="stage">STAGE</div>
    <div class="secview-wrap"><svg class="secview pm" viewBox="${x0.toFixed(1)} ${y0.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}" style="width:${Math.round(w / SEAT.px * 32)}px" role="group" aria-label="${esc(secName(s.name))} 좌석">${rows}${seats}</svg></div>
    ${seatLegend}
    <p class="tag">배치도에서는 ${s.rot}° 기울어 있던 구역이에요. 뒤로가기를 누르면 이 창만 닫혀요.</p>
    ${dev('구역 열기 · 좌석 고르기 = 화면 상태만 (history.pushState) · 서버 호출은 선택완료에서만')}
  </div><aside class="panel sec" id="pickPanel">${pickPanel()}</aside></div>`;
}
// 오른쪽 상자 — 고른 좌석 · 날짜 · 공연명 + 선택완료. 409 는 message 가 아니라 code 로 나눠 보여줌
function pickPanel() {

  if (!f.pick) return `<h2 style="font-size:17px">선택한 좌석</h2>${err}<p class="muted">좌석을 눌러 골라 주세요. 경합 좌석도 고를 수 있어요.</p>`;

    ${st === 'contested' ? '<p class="notice">다른 분도 고른 좌석이에요. 먼저 결제를 끝낸 한 분만 예매돼요.</p>' : ''}
    ${swap ? `<p class="tag">선택완료하면 지금 고른 <b>${esc(f.sel.label)}</b> 선택은 취소돼요 (1인 1석).</p>` : ''}

    ${dev(`N10 POST /api/concerts/${c.id}/bookings { seatId } + X-Entry-Token → 200 { bookingId, amount, pgOrderId, status: PENDING, expiresAt } (좌석 안 잡음 · 같은 좌석 = 같은 예매 · 다른 좌석이면 이전 선택 취소) · 409 SEAT_UNAVAILABLE (이미 팔림) · 처리 중 뒤로가기는 무시`)}`;
}
function refreshModal() {
  const m = $('#secModal'); if (!m) return;
  const v = m.querySelector('.secview-wrap'), sx = v ? v.scrollLeft : 0, sy = v ? v.scrollTop : 0;
  m.innerHTML = modalInner();
  const v2 = m.querySelector('.secview-wrap'); if (v2) { v2.scrollLeft = sx; v2.scrollTop = sy; }
}
// 좌석 화면 다시 그리기 — rerender 만 하면 AFTER.seats 의 타이머가 겹침
function redraw() { timers.forEach(t => { clearInterval(t); clearTimeout(t); }); timers = []; rerender(); }
function closeSec() {
  const k = S.flow.sec;
  Object.assign(S.flow, { sec: null, pick: null, pickLabel: null, err: null, loading: 0 });
  redraw();
  document.querySelector(`.plan [data-v="${CSS.escape(k)}"]`)?.focus();   // 창을 열었던 구역으로 포커스 돌려줌
}
// 내 선택(결제 대기 예매) 버리기 — 좌석 상태는 건드리지 않음 (고를 때 잡지 않았으니까)
function dropSel() { const f = S.flow; f.sel = null; f.bookingId = null; f.pgOrderId = null; }
AFTER.seats = () => {
  if (!$('#entryT')) return;
  const f = S.flow, m = $('#secModal');
  m.addEventListener('cancel', e => { e.preventDefault(); if (!f.busy) history.back(); });   // Esc 도 뒤로가기와 같은 길
  m.addEventListener('click', e => { if (e.target === m && !f.busy) history.back(); });      // 창 바깥 누르기
  if (f.sec) { f.loading = 0; m.innerHTML = modalInner(); m.showModal(); }
  const tick = () => {
    const left = f.entryUntil - Date.now();
    if (left <= 0) { S.flow = null; toast('입장 시간이 끝났어요. 대기열에 다시 들어가 주세요'); go('concert', { id: f.cid }); return; }
    document.querySelectorAll('#entryT, #entryT2').forEach(el => { el.textContent = '입장 시간 ' + mmss(left); el.classList.toggle('warn', left < 120000); });
    if (!f.sel) return;
    const hl = f.sel.until - Date.now();
    if (hl <= 0) { if (f.busy) return; dropSel(); toast('3분이 지나 좌석 선택이 만료됐어요. 다시 골라 주세요'); redraw(); return; }
    const ht = $('#selT'); if (ht) { ht.textContent = mmss(hl); ht.classList.toggle('warn', hl < 60000); }
  };
  tick(); timers.push(setInterval(tick, 1000));
};
// 뒤로가기 — 서버 요청 중이면 무시, 확대 창이 열려 있으면 그 창만 닫기, 결제 화면이면 선택을 둔 채 좌석 화면으로
window.addEventListener('popstate', () => {
  const f = S.flow;
  if (!f) return;
  if (f.busy) { history.pushState(f.sec ? { sec: f.sec } : { pay: 1 }, ''); toast(f.busy); return; }
  if (f.sec) { closeSec(); return; }
  if (S.route === 'pay') { if (f.sel) toast('고른 좌석은 남은 시간 동안 그대로예요'); go('seats', { id: f.cid }); }
});

const backLink = '<button class="link" data-act="backAsk">← 좌석 다시 고르기</button>';
V.pay = ({ id }) => {
  const c = CO(id), f = S.flow;
  if (!f || !f.sel) return `<div class="empty"><p>고른 좌석이 없어요.</p><button class="btn" data-go="concert" data-id="${id}">공연으로 돌아가기</button></div>`;
  return `
<div class="page-head"><div><p class="eyebrow">${esc(c.title)}</p><h1>결제</h1></div><span class="timer" id="selT">선택 유효 3:00</span></div>
<div class="split">
  <form class="panel form" data-submit="pay">
    <h2>결제 수단</h2>
    ${tossBox()}
    <label class="check fail" for="failsim"><input type="checkbox" id="failsim" name="fail"> (시연) 토스 인증 뒤 승인 단계에서 거절되는 상황</label>
    <label class="check sim" for="raceSim"><input type="checkbox" id="raceSim" name="race"> (시연) 같은 좌석을 고른 다른 분이 먼저 결제를 끝낸 상황</label>
    <button class="btn btn-primary" type="submit" id="payBtn" disabled>${won(c.price)} 결제하기</button>
    <p class="tag">토스페이먼츠 테스트 환경이에요. 실제 카드 정보를 넣어도 돈은 나가지 않아요.</p>
    ${dev(`토스 주문서형 setAmount(N10 의 amount ${c.price}) → 결제하기 = requestPayment({ orderId: N10 의 pgOrderId, orderName }) → { paymentKey, amount } → N16 POST /api/concerts/bookings/${f.bookingId}/confirm { paymentKey, amount } → 서버가 좌석을 먼저 확보(조건부 UPDATE)한 뒤 결제 승인 → { status: CONFIRMED | CANCELLED, paymentStatus } · 409 SEAT_UNAVAILABLE = 같은 좌석을 고른 다른 사람이 먼저 결제 (결제를 부르지 않음 · 돈 안 나감) · DECLINED = 예매 취소 · 좌석은 다시 경합 · 티켓은 P1 으로 결제 불가`)}
  </form>
  <aside class="panel sec"><h2 style="font-size:17px">예매 정보</h2>
    <dl class="kv"><dt>공연</dt><dd>${esc(c.title)}</dd><dt>일시</dt><dd>${md(c.date)} ${c.time}</dd><dt>장소</dt><dd>${esc(c.venue)}</dd>
      <dt>좌석</dt><dd>${esc(f.sel.label)}</dd><dt>금액</dt><dd class="num">${won(c.price)}</dd></dl>
    ${seatSt(f.cid, f.sel.key) === 'contested' ? '<p class="notice">다른 분도 고른 좌석이에요. 먼저 결제를 끝낸 한 분만 예매돼요.</p>' : ''}
    <div id="backBox">${backLink}</div>
    <p class="tag">휴대폰 · 브라우저 뒤로가기로 나가면 고른 좌석은 남은 시간 동안 그대로 두고 좌석 화면으로 돌아가요.</p>
  </aside>
</div>`;
};
AFTER.pay = () => {
  if (!$('#selT')) return;
  const f = S.flow;
  mountToss(CO(f.cid).price);
  const tick = () => {
    if (!f.sel || f.busy) return;
    const left = f.sel.until - Date.now();
    if (left <= 0) { dropSel(); toast('3분이 지나 좌석 선택이 만료됐어요. 다시 골라 주세요'); history.back(); return; }
    $('#selT').textContent = '선택 유효 ' + mmss(left);
    $('#selT').classList.toggle('warn', left < 60000);
  };
  tick(); timers.push(setInterval(tick, 1000));
};

V.done = ({ id }) => {
  const b = S.bookings.find(x => x.id === id), c = CO(b.cid);
  return `
<div class="queue">
  <p class="eyebrow">예매 확정</p>
  <h1 class="display-s">예매가 끝났어요</h1>
  <div class="panel" style="width:100%;text-align:left"><dl class="kv">
    <dt>예매 번호</dt><dd class="mono">${b.id}</dd><dt>공연</dt><dd>${esc(c.title)}</dd><dt>일시</dt><dd>${md(c.date)} ${c.time}</dd>
    <dt>장소</dt><dd>${esc(c.venue)}</dd><dt>좌석</dt><dd>${esc((b.labels || b.seats).join(', '))}</dd><dt>결제 금액</dt><dd class="num">${won(b.total)}</dd></dl></div>
  ${dev(`토스 paymentKey ${esc(b.paymentKey || '')} → N16 CONFIRMED → booking PAID → 분산 락 해제 → concert.booked 발행 → Member · AI 구독 · 데모는 승인(N16)을 흉내만 냄`)}
  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
    <button class="btn btn-primary" data-act="toBookings" data-id="${b.id}">모바일 티켓 보기</button><button class="btn" data-go="concerts">다른 공연 보기</button></div>
</div>`;
};
</script>

<script>
/* ===== 음반 · LP ===== */
const eul = w => w + (hasB(w) ? '을' : '를');
const coverMini = al => `<div class="mini-cover">${cover(al)}</div>`;

    <span class="end">${min ? `<span class="num">${won(min)}~</span>` : ''}<span class="pill ${st[1]}">${st[0]}</span></span></button>`;
};

V.albums = () => {

  const list = isNew ? ALBUMS.slice().sort((x, y) => y.date.localeCompare(x.date)) : ALBUMS.filter(a => a.lp).sort((x, y) => y.lp.date.localeCompare(x.lp.date));

<div class="page-head"><h1>음반 · LP</h1></div>
<div class="tabs" role="tablist">${['신보', 'LP 발매'].map(t => `<button role="tab" aria-selected="${S.atab === t}" data-act="atab" data-v="${t}">${t}</button>`).join('')}</div>
<div class="sec">

  ${isNew ? `<div class="grid albums">${list.map(alCard).join('')}</div>` : `<div class="list">${list.map(lpLi).join('')}</div>`}
</div>`;
};

V.album = ({ id }) => {
  const al = AL(id), a = A(al.artist), st = stockState(al), w = S.wish.has(id), o = S.owned.has(id);
  const soldOut = st && st[0] === '품절', tracks = al.tracks.split('|');
  const wishLabel = w ? (soldOut ? '재입고 알림 받는 중' : '위시리스트에 담았어요') : (soldOut ? '재입고 알림 받기' : '위시리스트 담기');

<button class="link" data-go="albums">← 음반 목록</button>
<div class="split" style="margin-top:16px">
  <div>
    <section class="album-head">
      <div class="big-cover">${cover(al)}</div>
      <div class="sec">
        <p class="eyebrow">${al.type}${isUpcoming(al.date) ? ' · 발매 예정' : ''}</p>
        <h1 class="display-s">${esc(al.title)}</h1>
        <button class="link" data-go="artist" data-id="${a.id}" style="justify-self:start">${esc(a.name)}</button>
        <p class="muted">${al.date.replaceAll('-', '.')} 발매 · ${tracks.length}곡</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${lpOffer(al) ? `<button class="btn btn-primary" data-go="lpay" data-id="${id}"><span class="num">${won(lpOffer(al)[1])}</span> LP 구매하기</button>` : ''}
          ${al.lp ? `<button class="btn ${w ? 'on' : ''}" data-act="wish" data-id="${id}" aria-pressed="${w}">${wishLabel}</button>` : ''}
          <button class="btn ${o ? 'on' : ''}" data-act="own" data-id="${id}" aria-pressed="${o}">${o ? '보유 중' : '보유 음반으로 표시'}</button>

      </div>
    </section>
    <section class="sec"><div class="sec-head"><h2>트랙리스트</h2></div><ol class="tracks">${tracks.map(t => `<li>${esc(t)}</li>`).join('')}</ol></section>
  </div>
  <aside>
    ${al.lp ? `<section class="sec"><div class="panel sec"><h2 style="font-size:17px">LP 정보</h2>
        <dl class="kv"><dt>카탈로그</dt><dd class="mono">${al.lp.cat}</dd><dt>사양</dt><dd>${esc(al.lp.press)}</dd><dt>LP 발매일</dt><dd>${al.lp.date.replaceAll('-', '.')}</dd></dl></div></section>
      <section class="sec"><div class="sec-head"><h2>판매처 재고</h2><span class="pill ${st[1]}">${st[0]}</span></div>
        ${al.stock.length ? stockTable(al) + '<p class="tag">재고는 1시간마다 갱신돼요.</p>' : '<div class="empty">LP 판매 전이에요. 위시리스트에 담으면 판매가 시작될 때 알려드려요.</div>'}</section>`
    : '<div class="empty">이 음반은 LP로 나오지 않았어요.</div>'}
  </aside>
</div>`;
};

/* ===== MY ===== */
const emptyBox = (t, to, label) => `<div class="empty"><p>${t}</p><button class="btn btn-s" data-go="${to}">${label}</button></div>`;
V.my = () => {
  const fol = followedIds(), tabs = ['관심 아티스트', '관심 공연', '위시리스트', '컬렉션', '예매 내역', '배송지', '취향 설정', '약관 · 동의'];
  let body = '';
  if (S.mtab === '관심 아티스트') body = fol.length ? `<div class="grid">${fol.map(id => acard(A(id))).join('')}</div>` : emptyBox('팔로우한 아티스트가 없어요.', 'artists', '아티스트 둘러보기');
  if (S.mtab === '관심 공연') { const l = [...S.interest].map(CO).sort(byDate); body = l.length ? `<div class="list">${l.map(concertLi).join('')}</div>` : emptyBox('관심 공연으로 담은 공연이 없어요.', 'concerts', '공연 보기'); }
  if (S.mtab === '위시리스트') { const l = [...[...S.wish].map(AL).map(lpLi), ...[...S.gwish].map(GD).map(goodsLi)]; body = l.length ? `<div class="list">${l.join('')}</div>` : emptyBox('담아 둔 LP·굿즈가 없어요. 품절된 상품을 담으면 재입고될 때 알려드려요.', 'albums', 'LP 둘러보기'); }
  if (S.mtab === '컬렉션') { const l = [...S.owned].map(AL); body = l.length ? `<div class="grid albums">${l.map(alCard).join('')}</div>` : emptyBox('보유 음반으로 표시한 앨범이 없어요.', 'albums', '음반 둘러보기'); }
  if (S.mtab === '예매 내역') body = S.bookings.length ? `<div class="list">${S.bookings.map(b => { const c = CO(b.cid), d = day(c.date); return `<div class="li">
      <span class="date"><b>${d.getDate()}</b><small>${d.getMonth() + 1}월 ${WD[d.getDay()]}</small></span>
      <span class="main"><b>${esc(c.title)}</b><small><span class="mono">${b.id}</span> · ${esc((b.labels || b.seats).join(', '))} · ${won(b.total)}</small></span>
      ${b.status === 'PAID' ? `<span class="pill ok">예매 완료</span><button class="btn btn-s" data-act="ticket" data-id="${b.id}" aria-pressed="${S.ticket === b.id}">${S.ticket === b.id ? '티켓 닫기' : '모바일 티켓'}</button><button class="btn btn-s" data-act="cancel" data-id="${b.id}">취소</button>` : '<span class="pill">취소됨</span>'}</div>`; }).join('')}</div>
      ${ticketPanel()}`
    : emptyBox('예매한 공연이 없어요.', 'concerts', '공연 보기');
  if (S.mtab === '배송지') body = addrTab();
  if (S.mtab === '취향 설정') body = `<div class="panel sec" style="max-width:720px">
      <h2 style="font-size:17px">즐겨 듣는 장르</h2><p class="tag">여기서 바꾼 취향은 홈 추천과 AI 챗봇에 바로 반영돼요.</p>
      <div class="chips">${GENRES.map(g => `<button class="chip ${S.user.genres.includes(g) ? 'on' : ''}" data-act="tasteGenre" data-v="${g}" aria-pressed="${S.user.genres.includes(g)}">${g}</button>`).join('')}</div>
      <h2 style="font-size:17px;margin-top:8px">팔로우 중인 밴드</h2><p>${fol.length ? esc(names(fol)) : '<span class="muted">아직 없어요</span>'}</p>
      <button class="btn btn-primary" data-act="saveTaste" style="justify-self:start">취향 저장</button>
      ${dev('PUT /api/members/me/preferences → outbox → member.preference.updated (전체 스냅샷) → ai_db.user_taste 덮어쓰기')}</div>`;
  if (S.mtab === '약관 · 동의') { const g = S.user.agreements; body = g ? `<div class="panel sec" style="max-width:720px">
      <dl class="kv">
        <dt>이용약관</dt><dd>${g.tos} · ${g.at} 동의 <button class="link" data-go="terms" data-id="tos">보기</button></dd>
        <dt>개인정보 수집 · 이용</dt><dd>${g.privacy} · ${g.at} 동의 <button class="link" data-go="terms" data-id="privacy">개인정보처리방침</button></dd>
        <dt>만 14세 이상</dt><dd>${g.at} 확인</dd>
        <dt>마케팅 정보 수신</dt><dd>${g.mkt ? '<span class="pill ok">받음</span>' : '<span class="pill">받지 않음</span>'} ${g.mktAt}부터</dd>
      </dl>
      <button class="btn" data-act="toggleMkt" style="justify-self:start">${g.mkt ? '마케팅 정보 그만 받기' : '마케팅 정보 받기'}</button>
      <p class="tag">팔로우한 밴드의 새 소식 · 재입고 알림은 요청하신 알림이라 이 설정과 상관없이 와요. 마케팅 수신에 동의하면 2년마다 동의 상태를 다시 알려 드려요.</p>
      ${dev('가입(POST /api/auth/signup) 때 콜백에서 받은 카카오 싱크 동의 내역(service_terms)을 member.user_agreement 에 복사 (구현) · M17 GET /api/members/me/agreements · M18 철회 = 카카오 POST /v2/user/revoke/service_terms + 이력 한 줄 · 다시 동의 = 카카오 추가 동의 화면 — M17 · M18 은 설계')}</div>`
    : emptyBox('카카오로 가입하면 카카오 동의 화면에서 동의한 약관이 여기 보여요. 이 데모는 가입 흐름 없이 시작했어요.', 'signup', '가입 흐름 보기'); }
  return `
<div class="page-head"><div style="display:flex;gap:14px;align-items:center">
  <span class="avatar" style="--c1:var(--accent);--c2:#c46bd8;--s:56px" aria-hidden="true">${esc(S.user.nick[0] || '나')}</span>
  <div><h1>${esc(S.user.nick)}</h1><p class="muted">${S.user.provider ? `카카오 계정 · ${esc(S.user.email)}` : '로그인 정보 없음'}</p></div></div></div>
<div class="tabs" role="tablist">${tabs.map(t => `<button role="tab" aria-selected="${S.mtab === t}" data-act="mtab" data-v="${t}">${t}</button>`).join('')}</div>
${body}`;
};

// MY › 배송지 — M19~M23. 최대 10개 · 기본 1개 · 기본을 지우면 가장 최근 배송지가 기본

  const list = addrList(), e = S.addrEdit, cur = typeof e === 'number' ? list.find(a => a.id === e) : null;
  const card = a => `<div class="addr">
      <div class="top"><b>${esc(a.label || '배송지')}</b>${a.isDefault ? '<span class="pill ac">기본</span>' : ''}</div>

        <button class="btn btn-s" data-act="addrDel" data-id="${a.id}">삭제</button></div></div>`;
  return `<div class="sec" style="max-width:720px">
    <div class="sec-head"><h2>배송지 <span class="tag num">${list.length}/${MAX_ADDR}</span></h2>

function planSvg(key) {
  const s0 = S.sections[key], stage = stageOf(s0.venue);
  const secs = Object.entries(S.sections).filter(([, s]) => s.venue === s0.venue && s.floor === s0.floor);
  const all = toC([...stage, ...secs.flatMap(([, s]) => s.pts)]), xs = all.map(p => p[0]), ys = all.map(p => p[1]);
  const x0 = Math.min(...xs) - 12, y0 = Math.min(...ys) - 12, w = Math.max(...xs) + 12 - x0, h = Math.max(...ys) + 12 - y0;
  const r = s0.rot * Math.PI / 180, tr = Math.abs(s0.rot) > 90 ? s0.rot + 180 : s0.rot;
  const rowl = s0.seats.filter(t => t.num === 1).map(t => `<text class="rowl" transform="translate(${(t.x * CW - Math.cos(r) * 8).toFixed(1)} ${(t.y * CH - Math.sin(r) * 8).toFixed(1)}) rotate(${tr})">${t.row}</text>`).join('');
  return `<svg class="plan" viewBox="${x0.toFixed(1)} ${y0.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}" role="img" aria-label="${esc(s0.venue)} ${s0.floor} 좌석 배치도 · ${esc(s0.name)} ${s0.seats.length}석">
    <polygon class="stage-ref" points="${cpts(stage)}"/>${label(stage, 'STAGE')}
    ${secs.map(([k, s]) => `<g class="${k === key ? 'new' : ''}"><polygon class="sec-ol" points="${cpts(s.pts)}"/>${seatRects(s.seats, s.rot)}${k === key ? rowl : ''}${label(s.pts, s.name, 'secl')}</g>`).join('')}
  </svg>`;
}

// 진짜 QR 이 아니라 자리만 보여 주는 무늬 (데모)
function qrSvg(seed) {
  const N = 21, fin = (x, y) => [[0, 0], [N - 7, 0], [0, N - 7]].some(([a, b]) => x >= a && x < a + 7 && y >= b && y < b + 7);
  const ring = (x, y) => { const [a, b] = [x < 7 ? 0 : N - 7, y < 7 ? 0 : N - 7], i = x - a, j = y - b; return i === 0 || j === 0 || i === 6 || j === 6 || (i > 1 && i < 5 && j > 1 && j < 5); };
  let h = 2166136261, r = '';
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    h = Math.imul(h ^ seed.charCodeAt((x + y * N) % seed.length) ^ x * 31 ^ y, 16777619) >>> 0;
    if (fin(x, y) ? ring(x, y) : h % 3 === 0) r += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg class="qr" viewBox="0 0 ${N} ${N}" role="img" aria-label="OTP 등록 QR (데모 무늬)"><g fill="#111">${r}</g></svg>`;
}

    const g = GD(S.adm.edit.id), delta = parseInt(fv(f, 'delta'), 10), reason = fv(f, 'reason');
    if (!delta) return admErr('늘리거나 줄일 수량을 넣어 주세요 (0 은 안 돼요)');
    if (g.stock + delta < 0) return admErr(`409 STOCK_NEGATIVE — 지금 재고(${g.stock}개)보다 많이 뺄 수 없어요`);
    g.stock += delta; S.adm.ledger.unshift({ id: g.id, delta, reason, at: nowStr() });
    toast(`재고를 ${delta > 0 ? '+' : ''}${delta}개 조정했어요 → ${g.stock}개`); admDone();
  },
  admDel(d) {
    if (d.t === 'venue') {
      const used = CONCERTS.filter(c => c.venue === d.id);
      if (used.length) return admErr(`409 VENUE_IN_USE — 이 콘서트장을 쓰는 공연이 ${used.length}개 있어요 (${used[0].title}${used.length > 1 ? ' 외' : ''}). 공연을 먼저 옮기거나 삭제해 주세요`);
      VMETA[d.id].del = true; VENUES.splice(VENUES.indexOf(d.id), 1);
      if (S.admin.venue === d.id) S.admin.venue = VENUES[0];
    }
    if (d.t === 'concert') {
      const c = CO(d.id), n = bkCount(c);
      if (n) return admErr(`409 CONCERT_HAS_BOOKINGS — 예매 ${n.toLocaleString()}건이 있어서 삭제할 수 없어요. 공연 취소 · 환불 흐름은 아직 정하지 않았어요`);
      binMove(CONCERTS, TRASH.c, c);
    }
    if (d.t === 'goods') {
      const g = GD(d.id);
      if (g.pending) return admErr(`409 PRODUCT_HAS_PENDING_ORDERS — 결제 대기 주문 ${g.pending}건이 끝나면(최대 3분) 다시 해 주세요`);
      binMove(GOODS, TRASH.g, g);
    }
    if (d.t === 'album') binMove(ALBUMS, TRASH.al, AL(d.id));
    toast(d.t === 'goods' || d.t === 'album' ? '판매를 중지했어요. 사용자 화면에서 빠지고 주문 내역은 남아요' : '삭제했어요. 사용자 화면에서 빠지고, 수집이 다시 가져와도 되살리지 않아요');
    admDone();
  },
  admRestore(d) {
    if (d.t === 'venue') { VMETA[d.id].del = false; VENUES.push(d.id); }
    else { const [arr, bin] = { concert: [CONCERTS, TRASH.c], goods: [GOODS, TRASH.g], album: [ALBUMS, TRASH.al] }[d.t], x = bin.find(y => y.id === d.id); bin.splice(bin.indexOf(x), 1); arr.push(x); x.del = false; }
    toast('복구했어요'); admDone();
  },
  impTemplate() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(xlsxBlob(sampleRows(S.adm.impArtist, S.adm.impBad)));
    a.download = `굿즈입고_${A(S.adm.impArtist).en.replace(/\s+/g, '')}.xlsx`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('양식을 내려받았어요. 행을 고친 뒤 위 파일 칸에 올려 주세요');
  },
  impSample() { readImport(new File([xlsxBlob(sampleRows(S.adm.impArtist, S.adm.impBad))], `굿즈입고_샘플_${A(S.adm.impArtist).en.replace(/\s+/g, '')}${S.adm.impBad ? '_오류' : ''}.xlsx`)); },
  impCancel() { S.adm.imp = null; rerender(); },
  impCommit(d, el) {
    const p = S.adm.imp;
    if (S.adm.imports.some(x => x.sha === p.sha)) { rerender(); return; }
    el.disabled = true; el.textContent = '입고하는 중…';
    timers.push(setTimeout(() => {
      let created = 0, updated = 0;
      p.rows.forEach(r => {
        const g = r.g && GD(r.g), next = { name: r.name, kind: r.kind, price: r.price, url: r.url };
        if (g) { Object.entries(next).forEach(([k, v]) => { if (!g.locked.includes(k)) g[k] = v; }); g.stock += r.qty; updated++; }
        else { GOODS.push({ id: 'g' + (++admSeq), artist: p.artist, ...next, stock: r.qty, v: 1 + admSeq % 4, src: '엑셀', locked: [], seller: p.seller, code: r.code }); created++; }
      });
      const qty = p.rows.reduce((s, r) => s + r.qty, 0);
      S.adm.imports.unshift({ at: nowStr(), file: p.file, artist: p.artist, seller: p.seller, created, updated, qty, sha: p.sha });
      S.adm.imp = null;
      toast(`입고를 마쳤어요 — 신규 ${created} · 변경 ${updated} · 재고 +${qty}개`); rerender();
    }, 900));
  },
  admCrawl(d) {
    const k = d.v;
    if (S.adm.running[k]) return admErr('409 CRAWL_RUNNING — 이미 수집 중이에요');
    S.adm.running[k] = true; rerender();
    timers.push(setTimeout(() => {
      const first = !S.adm.crawled[k], r = { at: nowStr(), by: '수동 · ' + S.adm.me.name, n: 0, u: 0, s: 0, f: 0 };
      S.adm.crawled[k] = true;
      if (k === 'concerts') {
        r.s = CONCERTS.length;
        if (first) {
          VMETA['구름아래 소극장'] = { region: '서울', addr: '서울 마포구 동교로 12', cap: null, src: '수집', del: false, locked: [], stage: false }; VENUES.push('구름아래 소극장');
          CONCERTS.push({ id: 'c' + (++admSeq), artists: ['a9'], title: '유리온실 〈김 서린 창〉 발매 공연', venue: '구름아래 소극장', region: '서울', addr: '서울 마포구 동교로 12', date: '2026-12-12', time: '19:00', type: '단독', price: 44000, queue: 0, noSeats: true, src: '수집', locked: [] });
          r.n = 1;
        }
      }
      if (k === 'venues') {
        const m = VMETA['롤링홀'];
        r.s = VENUES.length;
        if (first) { if (m.locked.includes('cap')) r.skip = 1; else { m.cap = 800; r.u = 1; r.s--; } }
      }
      if (k === 'goods') {
        r.s = GOODS.filter(g => g.src !== '직접 등록').length;
        if (first) { GOODS.push({ id: 'g' + (++admSeq), artist: 'a9', name: '〈김 서린 창〉 머그컵', kind: '생활', price: 16000, stock: 0, v: 2, src: '수집', locked: [], seller: sellerOf('a9'), code: 'SKU-901', url: `https://store.example.com/${slug('a9')}/SKU-901` }); r.n = 1; }
      }
      if (k === 'albums') r.s = ALBUMS.length;
      S.adm.runs[k].unshift(r); S.adm.running[k] = false;
      toast(`${CRAWL.find(c => c[0] === k)[1]} 수집을 마쳤어요 — 신규 ${r.n} · 변경 ${r.u}${r.skip ? ` · 잠긴 칸 ${r.skip}개 건너뜀` : ''}`); rerender();
    }, 1200));
  },
  csPick(d) { Object.assign(S.adm, { member: +d.id, wd: null, wdErr: null }); rerender(); },
  csNick(d) {
    const m = MEMBERS.find(x => x.id === +d.id), old = m.nick;
    m.nick = 'user' + (1000 + Math.floor(Math.random() * 9000));
    toast(`${old} → ${m.nick} 으로 초기화했어요. 본인이 다시 바꿀 수 있어요`); rerender();
  },
  csWdAsk(d) { Object.assign(S.adm, { wd: +d.id, wdErr: null }); rerender(); $('#wdOtp').focus(); },
  csWdCancel() { Object.assign(S.adm, { wd: null, wdErr: null }); rerender(); },
  csWithdraw(f) {
    if (!/^\d{6}$/.test(fv(f, 'otp'))) { S.adm.wdErr = '내 OTP 6자리를 넣어 주세요 — 되돌릴 수 없는 작업이라 다시 확인해요'; rerender(); $('#wdOtp').focus(); return; }
    const m = MEMBERS.find(x => x.id === S.adm.wd);
    Object.assign(m, { status: 'WITHDRAWN', nick: '(탈퇴)', email: null });
    Object.assign(S.adm, { wd: null, wdErr: null });
    toast(`#${m.id} 회원을 탈퇴 처리했어요 (사유 ${fv(f, 'reason')})`); rerender();
  }
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-act]');
  if (!t || t.disabled) return;
  if (t.dataset.go) { go(t.dataset.go, { id: t.dataset.id }); return; }
  if (ACT[t.dataset.act]) ACT[t.dataset.act](t.dataset, t, e);
});
document.addEventListener('submit', e => { e.preventDefault(); const f = e.target; if (ACT[f.dataset.submit]) ACT[f.dataset.submit](f); });
document.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; $('#artistGrid').innerHTML = artistGrid(); } });
document.addEventListener('change', e => { if (e.target.id === 'stageImg' && e.target.files[0]) { S.admin.img = URL.createObjectURL(e.target.files[0]); rerender(); } });
document.addEventListener('input', e => { if (e.target.id === 'admSec') { S.admin.name = e.target.value; $('#admFoot').innerHTML = admFoot(); } });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'admFloor') { S.admin.floor = t.value; rerender(); }
  if (t.id === 'admVenue') { if (t.value !== '__new') ACT.venue({ v: t.value }); else { S.admin.newVenue = true; rerender(); $('#newVenue').focus(); } }
});
// SVG 안의 버튼(구역 · 좌석)은 button 요소가 아니라서 Enter · Space 를 클릭으로 바꿔 줌
document.addEventListener('keydown', e => {
  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t instanceof SVGElement && t.matches('[role=button][data-act]')) { e.preventDefault(); t.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'csQ') { S.adm.cq = e.target.value; $('#csList').innerHTML = csList(); }
  if (e.target.id === 'impSeller') S.adm.impSeller = e.target.value;
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'impArtist') { Object.assign(S.adm, { impArtist: t.value, impSeller: sellerOf(t.value), imp: null }); rerender(); }
  if (t.id === 'impBad') S.adm.impBad = t.checked;
  if (t.id === 'impFile' && t.files[0]) readImport(t.files[0]);
});
document.addEventListener('change', e => {
  if (e.target.name === 'shipPick') { S.ship = e.target.value === 'new' ? 'new' : Number(e.target.value); $('#shipBox').innerHTML = shipBox(); }
});
$('#devmode').addEventListener('change', e => document.body.classList.toggle('devmode', e.target.checked));

$('#foot').innerHTML = footHtml();
render();
</script>
</body>
</html>
